# Production-style compose profile for release candidate validation.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod up -d
# Container hardening (ADR-0030 / P15-T01): read-only root FS + tmpfs writable paths + non-root images.
# ADR-0044: v1 topology = single backend replica (do not scale docgen-backend; see docs/adr/operations/0044-deployment-topology-v1.md).
# LR-B8 (ADR-0030 / ADR-0044): real backend healthcheck + mem/cpu limits; frontend gates on backend health.

services:
  docgen-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.packaged
    container_name: docgen-backend
    profiles:
      - prod
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=256m
    environment:
      SPRING_PROFILES_ACTIVE: prod,dev
      POSTGRES_HOST: docgen-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-docgen}
      POSTGRES_USER: ${POSTGRES_USER:-docgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docgen_local_pwd}
      REDIS_HOST: docgen-redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://docgen-minio:9000
      # LR-B / ADR-0044: prod profile must use Kafka async transport (ProductionAsyncTransportGuard
      # refuses in-process outside dev/local/test). Use the docker-network broker address, not the
      # host-local value from .env (which is localhost:9092 for mvn spring-boot:run).
      ASYNC_TRANSPORT: ${ASYNC_TRANSPORT:-in-process}
      KAFKA_BOOTSTRAP_SERVERS: docgen-kafka:9092
      DOCGEN_ASYNC_KAFKA_CONSUMER_GROUP: ${DOCGEN_ASYNC_KAFKA_CONSUMER_GROUP:-docgen-async-batch-worker}
      # BDD-OPS-JWT-SECRET-001 / JWT-C1: must be explicitly provisioned — no :-default fallback.
      # ProductionSecretGuard rejects known insecure JWT values whenever the prod profile is active
      # (even if APP_ENVIRONMENT remains dev for acceptance convenience below).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT30M}
      SESSION_ABSOLUTE_TTL: ${SESSION_ABSOLUTE_TTL:-PT8H}
      # LAB ONLY — local docker acceptance E2E needs ConfigAdGroupResolver + YAML account-groups.
      # AdGroupResolverGuard refuses type=config whenever the prod profile is active unless this
      # flag is true (BDD-OPS-AD-GROUP-STUB-001 / ADR-0054). Claimed production MUST omit or set
      # false — this is NOT enterprise AD/LDAP directory resolution.
      DOCGEN_AD_GROUP_RESOLVER_ALLOW_CONFIG_STUB_ON_PROD_PROFILE: ${DOCGEN_AD_GROUP_ALLOW_CONFIG_STUB:-true}
      APP_ENVIRONMENT: dev
      DOCGEN_SEED_DEMO_CATALOG: ${DOCGEN_SEED_DEMO_CATALOG:-false}
      # LR-C5: ≥500 templates for catalog pagination E2E (idempotent if LOAD-TPL-0500 exists)
      DOCGEN_SEED_CATALOG_LOAD: ${DOCGEN_SEED_CATALOG_LOAD:-false}
      DOCGEN_SEED_CATALOG_LOAD_COUNT: ${DOCGEN_SEED_CATALOG_LOAD_COUNT:-500}
      DOCGEN_DEMO_CLASSPATH_IMAGE_TIER_ENABLED: ${DOCGEN_DEMO_CLASSPATH_IMAGE_TIER_ENABLED:-true}
      PDF_PAGE_NUMBER_STAMPING_ENABLED: ${PDF_PAGE_NUMBER_STAMPING_ENABLED:-false}
      # Temporary LR-D3 scrape-smoke only — force low RPM so one 429 is observable without a 120-request flood.
      RUNTIME_RATE_LIMIT_RPM: ${RUNTIME_RATE_LIMIT_RPM:-120}
      RUNTIME_RATE_LIMIT_BURST: ${RUNTIME_RATE_LIMIT_BURST:-120}
      HOME: /tmp
      LIBREOFFICE_CONVERSION_MODE: cli
      # LR-B8: MaxRAMPercentage caps the heap at 75% of mem_limit (~1.15G of 1536m),
      # leaving headroom for metaspace/threads + LibreOffice CLI conversion peaks.
      JAVA_TOOL_OPTIONS: "-Djava.io.tmpdir=/tmp -XX:MaxRAMPercentage=75.0"
    # LR-B8: same order of magnitude as Helm values.yaml backend limits (cpu "2" / memory 1536Mi);
    # JVM heap 75% of 1536m ≈ 1.15G + LibreOffice conversion peak fits within the limit.
    mem_limit: 1536m
    cpus: 2.0
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      docgen-postgres:
        condition: service_healthy
      docgen-redis:
        condition: service_healthy
      docgen-minio:
        condition: service_healthy
      docgen-kafka:
        condition: service_healthy
    # LR-B8: real probe (was healthcheck: disable: true).
    # Jammy Temurin runtime has bash but not wget/curl — use /dev/tcp.
    # start_period 90s leaves time for Flyway migrations before failures count.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3; cat <&3 | grep -qi UP'",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  docgen-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.packaged
    container_name: docgen-frontend
    profiles:
      - prod
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=64m
    # LR-B8: same order of magnitude as Helm values.yaml frontend limits (cpu 500m / memory 256Mi);
    # static NGINX serving + SSE proxy needs little memory.
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "${FRONTEND_PORT:-4173}:8080"
    # LR-B8: gate on backend health now that the backend has a real healthcheck.
    depends_on:
      docgen-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
