# Production-style compose profile for release candidate validation.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod up -d
# Container hardening (ADR-0030 / P15-T01): read-only root FS + tmpfs writable paths + non-root images.
# ADR-0044: v1 topology = single backend replica (do not scale docgen-backend; see docs/adr/operations/0044-deployment-topology-v1.md).

services:
  docgen-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.packaged
    container_name: docgen-backend
    profiles:
      - prod
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=256m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: docgen-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-docgen}
      POSTGRES_USER: ${POSTGRES_USER:-docgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docgen_local_pwd}
      REDIS_HOST: docgen-redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://docgen-minio:9000
      JWT_SECRET: ${JWT_SECRET:-prod-change-me-32-bytes-minimum-secret}
      APP_ENVIRONMENT: prod
      DOCGEN_SEED_DEMO_CATALOG: ${DOCGEN_SEED_DEMO_CATALOG:-false}
      PDF_PAGE_NUMBER_STAMPING_ENABLED: ${PDF_PAGE_NUMBER_STAMPING_ENABLED:-false}
      HOME: /tmp
      LIBREOFFICE_CONVERSION_MODE: cli
      JAVA_TOOL_OPTIONS: "-Djava.io.tmpdir=/tmp"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      docgen-postgres:
        condition: service_healthy
      docgen-redis:
        condition: service_healthy
      docgen-minio:
        condition: service_healthy
    healthcheck:
      disable: true

  docgen-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.packaged
    container_name: docgen-frontend
    profiles:
      - prod
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=64m
    ports:
      - "${FRONTEND_PORT:-4173}:8080"
    depends_on:
      docgen-backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
