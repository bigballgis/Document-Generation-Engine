spring:
  application:
    name: docgen-backend
  # LR-A3 (CD-PIT-04): multipart upload limits — 50MB per file, 60MB per request (headroom
  # for multi-file batches). Mirrored by nginx client_max_body_size and MasterDocumentService.
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:60MB}
  # LR-B5: bounded drain window per shutdown phase; executors/Kafka drain in ~25s below it.
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_DRAIN_TIMEOUT:30s}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:docgen}
    username: ${POSTGRES_USER:docgen}
    password: ${POSTGRES_PASSWORD:docgen_local_pwd}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${DOCGEN_ASYNC_KAFKA_CONSUMER_GROUP:docgen-async-batch-worker}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

docgen:
  environment: ${APP_ENVIRONMENT:dev}
  # PRR-D01b: scrape Basic off by default for local/dev; prod profile enables (D01B-C5).
  actuator:
    scrape-auth-enabled: ${DOCGEN_ACTUATOR_SCRAPE_AUTH_ENABLED:false}
    scrape-username: ${DOCGEN_ACTUATOR_SCRAPE_USERNAME:}
    scrape-password: ${DOCGEN_ACTUATOR_SCRAPE_PASSWORD:}
  runtime:
    rate-limit:
      enabled: ${RUNTIME_RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${RUNTIME_RATE_LIMIT_RPM:120}
      burst-capacity: ${RUNTIME_RATE_LIMIT_BURST:120}
      # Process-local by default; set true only for Redis-coordinated shared quota (PQH-F7).
      distributed: ${RUNTIME_RATE_LIMIT_DISTRIBUTED:false}
  invocation:
    cleanup-interval-ms: ${DOCGEN_INVOCATION_CLEANUP_INTERVAL_MS:3600000}
    cleanup-batch-size: ${DOCGEN_INVOCATION_CLEANUP_BATCH_SIZE:1000}
  content-module:
    pending-review-inbox-limit: ${DOCGEN_CM_PENDING_REVIEW_INBOX_LIMIT:500}
    submitted-scan-page-size: ${DOCGEN_CM_SUBMITTED_SCAN_PAGE_SIZE:1000}
  idempotency:
    cache: ${IDEMPOTENCY_CACHE:redis}
    redis-key-prefix: "docgen:idempotency:"
  async:
    transport: ${ASYNC_TRANSPORT:in-process}
    stale-processing-threshold-seconds: ${DOCGEN_ASYNC_STALE_PROCESSING_THRESHOLD_SECONDS:900}
    stale-reclaim-interval-ms: ${DOCGEN_ASYNC_STALE_RECLAIM_INTERVAL_MS:300000}
    kafka:
      async-batch-topic: generation.async-batch-task.v1
      dead-letter-topic: generation.async-batch-task.v1.dlt
      consumer-group: docgen-async-batch-worker
  rendering:
    libreoffice-command: ${LIBREOFFICE_COMMAND:soffice}
    conversion-mode: ${LIBREOFFICE_CONVERSION_MODE:cli}
    docker-container-name: ${LIBREOFFICE_DOCKER_CONTAINER:docgen-libreoffice}
    conversion-timeout-seconds: ${PDF_CONVERSION_TIMEOUT_SECONDS:120}
    # IBL-B2 / B2-C2: bounded absorb defaults (pool=4, queue=8). AbortPolicy still fail-closed
    # when saturated; ops may set PDF_CONVERSION_* to 2/0 for intentional fail-fast envs.
    conversion-pool-size: ${PDF_CONVERSION_POOL_SIZE:4}
    conversion-queue-capacity: ${PDF_CONVERSION_QUEUE_CAPACITY:8}
    # LR-A7 / ADR-0042: pagination delta budget (pages) — measurement baseline in NFR;
    # runtime enforcement pending ADR acceptance.
    pagination-delta-budget-pages: ${PAGINATION_DELTA_BUDGET_PAGES:1}
    max-generated-artifact-bytes: ${MAX_GENERATED_ARTIFACT_BYTES:52428800}
    pdf-page-number-stamping-enabled: ${PDF_PAGE_NUMBER_STAMPING_ENABLED:false}
    # LR-B3: progress-stream SSE timeout (longest batch test + margin) and keep-alive
    # heartbeat cadence. Proxy read timeout must be >= 3x the heartbeat interval.
    sse-timeout: ${SSE_TIMEOUT:PT15M}
    sse-heartbeat-interval: ${SSE_HEARTBEAT_INTERVAL:PT20S}
    demo-classpath-image-tier-enabled: ${DOCGEN_DEMO_CLASSPATH_IMAGE_TIER_ENABLED:false}
    # LR-A6 / ADR-0043: post-assembly OOXML well-formedness gate (default ON).
    ooxml-validation-enabled: ${DOCGEN_OOXML_VALIDATION_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me-please-32bytes-min}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT30M}
  # LR-B6: sliding session renewal + revocation (absolute limit anchored at first login;
  # revocation list backend must be redis outside tests — memory is transitional-test-only).
  session:
    absolute-ttl: ${SESSION_ABSOLUTE_TTL:PT8H}
    revocation-store: ${SESSION_REVOCATION_STORE:redis}
  storage:
    provider: ${STORAGE_PROVIDER:minio}
    bucket: ${STORAGE_BUCKET:docgen-artifacts}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ROOT_USER:docgen}
      secret-key: ${MINIO_ROOT_PASSWORD:docgen_local_pwd}
  master:
    max-docx-upload-bytes: ${DOCGEN_MASTER_MAX_DOCX_UPLOAD_BYTES:52428800}
  demo-catalog:
    seed-enabled: ${DOCGEN_SEED_DEMO_CATALOG:false}
  # SYS-NORM Wave 8 / W8-C2: optional managed Asset Library seed for demo/验收 only.
  # Default false — production honest empty (W8-001). Not classpath ghost catalog rows (N23).
  demo-asset-library:
    seed-enabled: ${DOCGEN_SEED_DEMO_ASSET_LIBRARY:false}
  catalog-load-seed:
    # LR-C5: ≥500 templates across groups for pagination / p95 evidence.
    # Enable: DOCGEN_SEED_CATALOG_LOAD=true (optional DOCGEN_SEED_CATALOG_LOAD_COUNT=500)
    enabled: ${DOCGEN_SEED_CATALOG_LOAD:false}
    template-count: ${DOCGEN_SEED_CATALOG_LOAD_COUNT:500}
  # LOCAL/TEST ONLY — ConfigAdGroupResolver + account-groups demo map.
  # Acceptance/production must NOT use type=config silently (ADR-0054 / BDD-OPS-AD-GROUP-STUB-001):
  # AdGroupResolverGuard fails closed on prod-shaped paths unless a configured directory adapter
  # exists, OR (local docker acceptance LAB ONLY) allow-config-stub-on-prod-profile=true
  # via DOCGEN_AD_GROUP_RESOLVER_ALLOW_CONFIG_STUB_ON_PROD_PROFILE / DOCGEN_AD_GROUP_ALLOW_CONFIG_STUB.
  ad-group-resolver:
    type: config
    # Default false. Local docker-compose.prod.yml sets true (LAB ONLY). Claimed production must omit.
    # Env: DOCGEN_AD_GROUP_RESOLVER_ALLOW_CONFIG_STUB_ON_PROD_PROFILE (compose shorthand DOCGEN_AD_GROUP_ALLOW_CONFIG_STUB).
    allow-config-stub-on-prod-profile: ${DOCGEN_AD_GROUP_RESOLVER_ALLOW_CONFIG_STUB_ON_PROD_PROFILE:false}
    account-groups:
      svc-caller:
        - RETAIL_API
        - CORP_API
      e2e-runtime-caller:
        - RETAIL_API
        - CORP_API
  collaboration:
    escalation:
      enabled: ${DOCGEN_COLLABORATION_ESCALATION_ENABLED:true}
      fixed-delay-ms: ${DOCGEN_COLLABORATION_ESCALATION_DELAY_MS:300000}
    # LR-C7: max rows returned by GET /collaboration-notifications (newest first).
    notification-list-size: ${DOCGEN_COLLABORATION_NOTIFICATION_LIST_SIZE:20}
  # LR-D1 / ADR-0048: Tier-1 audit retention (management 90d / runtime 365d hard delete).
  audit:
    retention-enabled: ${DOCGEN_AUDIT_RETENTION_ENABLED:true}
    management-retention-days: ${DOCGEN_AUDIT_MANAGEMENT_RETENTION_DAYS:90}
    runtime-retention-days: ${DOCGEN_AUDIT_RUNTIME_RETENTION_DAYS:365}
    retention-cron: ${DOCGEN_AUDIT_RETENTION_CRON:0 0 3 * * *}
    cleanup-batch-size: ${DOCGEN_AUDIT_CLEANUP_BATCH_SIZE:1000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${docgen.environment}
  tracing:
    enabled: false
    sampling:
      probability: 0.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

resilience4j:
  circuitbreaker:
    instances:
      objectStorage:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      pdfConversion:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
      docxNormalization:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
  retry:
    instances:
      objectStorage:
        max-attempts: 3
        wait-duration: 200ms
      pdfConversion:
        max-attempts: 2
        wait-duration: 500ms
      docxNormalization:
        max-attempts: 2
        wait-duration: 500ms

server:
  port: ${BACKEND_PORT:8080}
  # LR-B5: stop accepting new requests on SIGTERM, let in-flight requests drain.
  shutdown: graceful
