spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME_MS:1800000}

docgen:
  # PRR-D01b: claimed-prod / acceptance-hardening — metrics/prometheus require HTTP Basic.
  # Credentials from env/secrets only; empty username/password => fail-closed 401 (no image default).
  actuator:
    scrape-auth-enabled: ${DOCGEN_ACTUATOR_SCRAPE_AUTH_ENABLED:true}
    scrape-username: ${DOCGEN_ACTUATOR_SCRAPE_USERNAME:}
    scrape-password: ${DOCGEN_ACTUATOR_SCRAPE_PASSWORD:}
  runtime:
    rate-limit:
      # Process-local Bucket4j remains authoritative for v1 (ADR-0044 honesty).
      # Redis distributed limiter is deferred — default false; not multi-instance complete.
      distributed: ${RUNTIME_RATE_LIMIT_DISTRIBUTED:false}
  multi-instance:
    sse-sticky-sessions-required: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true

logging:
  level:
    root: INFO
    com.bank.docgen: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
