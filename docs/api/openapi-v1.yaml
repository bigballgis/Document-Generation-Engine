        - name
        - masterId
        - lifecycleStatus
        - devVersionId
        - devVersionNumber
        - exportedAt
      properties:
        templateId:
          type: string
          format: uuid
          description: Internal template UUID from the source environment.
        externalId:
          type: string
        groupCode:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        masterId:
          type: string
          format: uuid
        lifecycleStatus:
          $ref: '#/components/schemas/TemplateLifecycleStatus'
        releaseVersion:
          type: string
          nullable: true
        devVersionId:
          type: string
          format: uuid
        devVersionNumber:
          type: integer
          minimum: 1
        exportedAt:
          type: string
          format: date-time
        locale:
          type: string
          maxLength: 64
          nullable: true
          description: IBL-E1 / ADR-0062 — package body locale (BCP-47) when present.
        localeVariantFamilyId:
          type: string
          format: uuid
          nullable: true
          description: IBL-E1 / ADR-0062 — optional locale-variant family id.
    TemplateExportVariableSchemaView:
      type: object
      additionalProperties: false
      required:
        - variableKey
        - variableType
        - required
      properties:
        id:
          type: string
        variableKey:
          type: string
        variableType:
          $ref: '#/components/schemas/TemplateVariableType'
        required:
          type: boolean
        defaultValue:
          type: string
          nullable: true
        enumValues:
          type: string
          nullable: true
          description: Serialized enum values for ENUM variables.
        description:
          type: string
          nullable: true
        piiCategory:
          allOf:
            - $ref: '#/components/schemas/VariablePiiCategory'
          nullable: true
          description: >
            CE-G03 — optional PII category. Omitted or null on import means `NONE`.
            Does not embed test-data-set variable values in the export bundle.
    TemplateExportAnchorBindingView:
      type: object
      additionalProperties: false
      required: [anchorId, declaredContentType, updatedAt]
      properties:
        id:
          type: string
        anchorId:
          type: string
        declaredContentType:
          type: string
        structuredContentJson:
          type: string
          nullable: true
        pasteCleaningEvidence:
          $ref: '#/components/schemas/PasteCleaningEvidence'
          description: >
            Optional non-sensitive paste-cleaning residue exported with the binding.
            Must not include source HTML. Unresolved blockers remain fail-closed on
            re-import / validate / publish (ops-paste-binding-seam).
        validationStatus:
          type: string
          enum: [VALID, MISSING_ANCHOR, DUPLICATE_BINDING, INCOMPATIBLE_CONTENT_TYPE]
        updatedAt:
          type: string
          format: date-time
          description: >
            CE-U21 — server concurrency token for this binding row (ISO-8601 Instant).
            Clients must send the same value as `expectedUpdatedAt` on update Save.
    UpsertAnchorBindingRequest:
      type: object
      additionalProperties: false
      required: [anchorId, declaredContentType, structuredContentJson]
      properties:
        anchorId:
          type: string
          minLength: 1
        declaredContentType:
          $ref: '#/components/schemas/MasterAnchorContentType'
        structuredContentJson:
          type: string
          minLength: 1
        pasteCleaningEvidence:
          $ref: '#/components/schemas/PasteCleaningEvidence'
        clearPasteCleaningEvidence:
          type: boolean
          description: >
            When true, clears persisted paste-cleaning residue (ops-paste-binding-seam S5).
        expectedUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            CE-U21 — required when updating an existing binding; must equal the row's
            current `updatedAt` (millisecond Instant equality). Omit on first create.
            Mismatch → 409 BINDING_VERSION_CONFLICT
            (`api.error.template.bindingVersionConflict`). Missing on update → 422.
    TemplateExportCompositionRuleView:
      type: object
      additionalProperties: false
      required: [ruleId, conditionExpression, targetAnchorId]
      properties:
        ruleId:
          type: string
        conditionExpression:
          type: string
        targetAnchorId:
          type: string
        trueBranchRuleId:
          type: string
          nullable: true
        falseBranchRuleId:
          type: string
          nullable: true
    CompositionInclusionMatch:
      type: object
      additionalProperties: false
      description: >-
        ADR-0063. At least one of jurisdiction / product / channel must be
        non-blank after trim. Declared axes are AND; undeclared axes are wildcards.
      properties:
        jurisdiction:
          type: string
          nullable: true
          maxLength: 128
        product:
          type: string
          nullable: true
          maxLength: 128
        channel:
          type: string
          nullable: true
          maxLength: 128
    CompositionInclusionRuleView:
      type: object
      additionalProperties: false
      required: [ruleId, referenceKey, match]
      properties:
        ruleId:
          type: string
          minLength: 1
        referenceKey:
          type: string
          minLength: 1
          description: Must resolve to a CM reference on the same template version.
        match:
          $ref: '#/components/schemas/CompositionInclusionMatch'
        priority:
          type: integer
          default: 0
          description: Lower value wins when ordering; ties broken by ruleId ascending.
        requiredInclusion:
          type: boolean
          default: false
          description: >-
            When true and no rule for this referenceKey matches, generate fails
            with COMPOSITION_INCLUSION_UNSATISFIED.
    PutCompositionInclusionRulesRequest:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/CompositionInclusionRuleView'
    CompositionInclusionRulesResponse:
      type: object
      additionalProperties: false
