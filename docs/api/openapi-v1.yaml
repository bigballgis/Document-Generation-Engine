  /api/management/v1/library/assets:
    get:
      tags: [Admin]
      operationId: listLibraryAssets
      summary: List group-scoped asset-library catalog entries (CE-E02 + ALGI)
      description: >-
        Returns a management `PageView` of group-owned MinIO asset catalog rows
        (metadata only; no binary). Platform-shared catalog is withdrawn (ALGI).
        Default `status=ACTIVE` when omitted; `DISABLED` or `ALL` must be
        explicit. Optional filters: `groupCode` (exact), `assetClass`,
        `q` (case-insensitive contains on `assetKey` / `originalFileName`).
        Non-GLOBAL actors: results ∩ authorized groups; unauthorized
        `groupCode` → empty page (no leak). GLOBAL_ADMIN: omit `groupCode` →
        all groups; with filter → that group only. Each item includes
        `groupCode`. Requires `manageAssetLibrary` /
        `route.asset-library-management`; `TEMPLATE_TESTER` is ACTIVE-only.
        Behavior SoT: docs/behavior/asset-library-group-isolation.md
        (BDD-ALGI-005…007, 018).
      parameters:
        - $ref: '#/components/parameters/CatalogPageQuery'
        - $ref: '#/components/parameters/CatalogSizeQuery'
        - $ref: '#/components/parameters/CatalogGroupCodeQuery'
        - name: assetClass
          in: query
          required: false
          description: Optional exact asset class filter.
          schema:
            $ref: '#/components/schemas/AssetLibraryAssetClass'
        - name: status
          in: query
          required: false
          description: >-
            Catalog status filter. Omit or `ACTIVE` → ACTIVE only (default).
            `DISABLED` → disabled only. `ALL` → ACTIVE ∪ DISABLED.
          schema:
            $ref: '#/components/schemas/AssetLibraryListStatusFilter'
          example: ACTIVE
        - name: q
          in: query
          required: false
          description: >-
            Optional case-insensitive contains search over `assetKey` and
            `originalFileName`. Blank ignored.
          schema:
            type: string
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Paginated asset catalog metadata (items include groupCode).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetLibraryAssetPageResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Admin]
      operationId: uploadLibraryAsset
      summary: Upload a group-scoped asset-library object (CE-E02 + ALGI)
      description: >-
        Multipart upload of an IMAGE / SEAL / OTHER asset into an owning
        business `groupCode` (required). Natural identity is
        `(groupCode, assetKey)` (both trim). Logical `assetKey` must match
        `^[A-Za-z][A-Za-z0-9._-]{0,127}$`; bindings stay bare `assetKey`
        (no `groupCode/` prefix). Physical MinIO object key is
        `{groupCode}/{assetKey}` (± extension candidates). Allowed MIME
        `image/png` | `image/jpeg`; application-layer max 5 MiB →
        422 `ASSET_LIBRARY_PAYLOAD_TOO_LARGE`. Missing/blank `groupCode` →
        422 `ASSET_LIBRARY_GROUP_CODE_REQUIRED`. Unauthorized group → 403.
        ACTIVE conflict **within the same group** → 409
        `ASSET_LIBRARY_ASSET_KEY_CONFLICT`; same `(groupCode, assetKey)` when
        DISABLED may re-upload and reactivate (audit `ASSET_LIBRARY_REUPLOAD`).
        Same `assetKey` in a different group is allowed. SEAL upload requires
        GLOBAL_ADMIN / GROUP_ADMIN authorized for that group (fail-closed 403;
        former TEMPLATE_APPROVER absorbed). Header `Idempotency-Key` is
        reserved / **not enforced** (accepted if present; ignored). Behavior
        SoT: docs/behavior/asset-library-group-isolation.md
        (BDD-ALGI-001…004, 009, 014).
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Reserved / not enforced. May be sent on the management upload
            path; the server ignores it (no idempotency store, replay, or
            conflict semantics).
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetLibraryUploadRequest'
            encoding:
              file:
                contentType: image/png, image/jpeg
      responses:
        '201':
          description: >-
            Asset stored ACTIVE under owning groupCode; catalog row returned
            (includes groupCode; no binary).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetLibraryAssetResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: >-
            ACTIVE `(groupCode, assetKey)` already exists
            (`ASSET_LIBRARY_ASSET_KEY_CONFLICT` /
            `api.error.assetLibrary.assetKeyConflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: >-
            Validation failure (missing groupCode, invalid key,
            unsupported/mismatched content type, empty file, or
            application-layer payload > 5 MiB).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/management/v1/library/assets/{assetKey}/disable:
    post:
      tags: [Admin]
      operationId: disableLibraryAsset
      summary: Disable a group-scoped asset-library entry (CE-E02 + ALGI)
      description: >-
        Marks catalog identity `(groupCode, assetKey)` DISABLED and deletes
        namespaced resolvable MinIO object key(s) so template resolve
        fail-closes with existing IMAGE_ASSET_NOT_FOUND / SEAL_ASSET_NOT_FOUND.
        `groupCode` is required as a query parameter (locked OpenAPI shape).
        Admin-only (GLOBAL_ADMIN / GROUP_ADMIN authorized for that group).
        Unauthorized callers receive 403 without existence leakage. Behavior
        SoT: docs/behavior/asset-library-group-isolation.md
        (BDD-ALGI-008…009). Disable of an already-DISABLED identity is
        idempotent HTTP 200 (catalog remains DISABLED; resolvable objects
        re-checked for deletion).
      parameters:
        - name: assetKey
          in: path
          required: true
          description: Logical asset key (same grammar as upload; bare binding key).
          schema:
            type: string
            pattern: '^[A-Za-z][A-Za-z0-9._-]{0,127}$'
        - name: groupCode
          in: query
          required: true
          description: >-
            Owning business groupCode for the asset identity (trim). Required
            to disambiguate composite uniqueness `(groupCode, assetKey)`.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Asset disabled; catalog metadata returned (includes groupCode; no binary).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetLibraryAssetResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          description: >-
            Identity not found for authorized admin
            (`ASSET_LIBRARY_ASSET_NOT_FOUND` /
            `api.error.assetLibrary.assetNotFound`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/management/v1/dashboard/summary:
    get:
      tags: [Admin]
      operationId: getDashboardSummary
      summary: Dashboard Overview bucket counts (PRR-D01c)
      description: >-
        Returns authorized-group aggregate counts for Dashboard Overview stats
        cards (BDD-PRR-D01C-002 / D01C-C1 / D01C-C2): masterPendingReview,
        masterVersionsInProgress (DRAFT ∪ REJECTED), templateVersionsInWorkflow
        (DRAFT ∪ TESTING ∪ APPROVAL ∪ PENDING_RELEASE), publishedVersions,
        stoppedVersions, catalogMasters, catalogTemplates. Counts only — not a
        paginated catalog and not a substitute for collaboration/workflow task
        inboxes. Unauthenticated callers receive 401. Empty group authorization
        yields zeros (fail-closed; no cross-group leakage).
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Dashboard summary counts returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/management/v1/masters:
    get:
      tags: [Admin]
      operationId: listMasters
      summary: List masters (server-side PageView)
      description: >-
        Returns a standard management `PageView` of master document package
        summaries for the caller's authorized groups (LR-C5 /
        BDD-LRP-C5-CATALOG-001). Breaking change vs pre-LR-C5 bare array:
        management UI upgrades in the same slice; no external runtime callers.
        Default sort is group-first (`groupCodeAsc`). Optional `search` is
        case-insensitive contains over `name` ∪ `groupCode`. Optional `status`
        is exact master review status. Pagination unit is **rows** (COR-F09).
        Requires catalog browse / master read per permission matrix; fail-closed
        for unauthorized groups.
      parameters:
        - $ref: '#/components/parameters/CatalogPageQuery'
        - $ref: '#/components/parameters/CatalogSizeQuery'
        - $ref: '#/components/parameters/CatalogSearchQuery'
        - $ref: '#/components/parameters/CatalogGroupCodeQuery'
        - name: status
          in: query
          required: false
          description: >-
            Exact master review status filter. Unknown enum: empty page
            recommended (or 400/422 — lock in tests).
          schema:
            $ref: '#/components/schemas/MasterDocumentReviewStatus'
        - name: sort
          in: query
          required: false
          description: >-
            Whitelist sort key. Default `groupCodeAsc`. `groupAsc` is accepted as
            a synonym of `groupCodeAsc`. Unknown values fall back to
            `groupCodeAsc` (no 400).
          schema:
            type: string
            enum:
              - groupCodeAsc
              - groupAsc
              - updatedAtDesc
              - updatedAtAsc
              - nameAsc
            default: groupCodeAsc
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Paginated master summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterDocumentPageResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/management/v1/masters/{masterId}/revision-lines:
    get:
      tags: [Admin]
      operationId: listMasterRevisionLines
      summary: List paginated master revision lines
      description: >-
        Returns revision lines for a master package ordered by recency (current
        line first). **Phase A (Done):** may return only the current line with
        honest pagination (`totalElements: 1`). **Phase B (P2-T06):** each file
        replace persists an immutable row; this endpoint returns the full history
        with honest `totalElements`, `totalPages`, and `content[]` slicing.
        Requires group-scoped read access (`DOCUMENT_AUTHOR`, `GLOBAL_ADMIN`,
        or other roles with master read per permission matrix); fail-closed
        `403 ACCESS_DENIED` when the master is outside authorized groups.
        Traceability: BDD-MASTER-REVISION-NAV-001 Phase B.
      parameters:
        - name: masterId
          in: path
          required: true
          description: Master document resource UUID.
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Page size (default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Paginated revision line summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterRevisionLinePageResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/management/v1/masters/{masterId}/revision-lines/{revisionLineId}:
    get:
      tags: [Admin]
      operationId: getMasterRevisionLine
      summary: Get master revision line detail
      description: >-
        Returns overview, anchor catalog snapshot, and review history for a
        revision line belonging to the master. **Phase A:** only the current
        `revisionLineId` (matching `current_revision_line_id`) succeeds.
        **Phase B:** any historical or current line id belonging to the master
        succeeds. Unknown id or id belonging to another master returns `404`
        without cross-master leakage. Historical lines expose read-only detail;
        workflow mutations remain on package-level routes.
      parameters:
        - name: masterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: revisionLineId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Revision line detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterRevisionLineDetailResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/management/v1/masters/{masterId}/revision-lines/{revisionLineId}/download:
    get:
      tags: [Admin]
      operationId: downloadMasterRevisionLineDocx
      summary: Download DOCX bytes for a master revision line
      description: >-
        Streams the stored DOCX artifact for the given revision line. Response
        uses `Content-Disposition: attachment` with the line's
        `originalFilename`. **Phase B:** historical lines return superseded file
        bytes, not the current package file. Same authorization and 404 semantics
        as revision line detail. Not wrapped in the JSON success envelope.
      parameters:
        - name: masterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: revisionLineId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: DOCX file attachment for the revision line.
          headers:
            Content-Disposition:
              description: Attachment filename from revision line originalFilename.
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/management/v1/masters/{masterId}/revision-lines/{revisionLineId}/anchors/{anchorId}:
    patch:
      tags: [Admin]
      operationId: updateMasterRevisionLineAnchorDisplayLabel
      summary: Update displayLabel for a master revision-line anchor
      description: >-
        CE-U06: updates `displayLabel` on the **current** writable revision-line
        anchor snapshot and keeps the live `master_document` catalog in sync.
        Requires `manageMasters` and package status not `PENDING_REVIEW`.
        Historical (`current=false`) lines are rejected with
        `api.error.master.invalidState`. `anchorId` and `documentSequence` are
        immutable via this endpoint; displayLabel-only changes do not affect
        CE-K05 anchor-set delta / `retestRequired`. Blank or whitespace-only
        labels are rejected (trim; English-first validation messageKey).
        Traceability: BDD-CE-U06-MAC-003…009.
      parameters:
        - name: masterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: revisionLineId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: anchorId
          in: path
          required: true
