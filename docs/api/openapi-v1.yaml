          type: string
          maxLength: 2048
        locale:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            IBL-E1 / ADR-0062 — required BCP-47 body locale for the content-module
            package (not a version-row field).
        localeVariantFamilyId:
          type: string
          format: uuid
          nullable: true
          description: >-
            IBL-E1 / ADR-0062 — optional UUID grouping translation siblings.
