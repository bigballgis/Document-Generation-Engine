      enum: [PUBLISHED, PINNED_RETROACTIVELY, EXPORT_TIME]
    TemplateExportMasterPinView:
      type: object
      additionalProperties: false
      description: >-
        CE-E01 v2 master revision fingerprint. Consumes CE-K01 fields
        `master_revision_id` / `master_file_hash` (or EXPORT_TIME hash).
        Reused by CE-U19 as optional `masterPin` on management release /
        version-line detail GET (published pin read-back; not a new schema).
        See docs/behavior/ce-k01-release-bundle-pinning.md,
        docs/behavior/ce-e01-export-bundle-v2.md (E01-C4), and
        docs/behavior/ce-u19-dependency-readonly-view.md (U19-D5).
      required: [masterRevisionId, masterFileHash]
      properties:
        masterRevisionId:
          type: string
          format: uuid
          description: Pinned `master_revision_line.id` (or current line at EXPORT_TIME).
        masterFileHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of pinned master DOCX bytes (lowercase hex).
        revisionSequence:
          type: integer
          minimum: 1
          nullable: true
          description: Optional `master_revision_line.revision_sequence` snapshot.
        pinOrigin:
          $ref: '#/components/schemas/TemplateExportMasterPinOrigin'
          nullable: true
    TemplateExportClauseSnapshotView:
      type: object
      additionalProperties: false
      description: CE-E01 clause body/structure snapshot embedded in v2 bundle (no test data).
      required: [moduleCode, moduleVersionId, versionNumber, contentStructureJson]
      properties:
        moduleCode:
          type: string
        moduleVersionId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          minimum: 1
          description: Major component of the pinned semantic version (compat / display).
        contentStructureJson:
          type: string
          description: Structured content / body snapshot as JSON text (non-secret).
        locked:
          type: boolean
          description: Whether the template content-module reference was locked at export.
          nullable: true
        jurisdiction:
          type: string
          nullable: true
          description: Optional CE-K08 legal metadata snapshot when present on the module version.
        effectiveFrom:
          type: string
          format: date
          nullable: true
        effectiveTo:
          type: string
          format: date
          nullable: true
        legalReviewRef:
          type: string
          nullable: true
        semanticVersion:
          type: string
          nullable: true
          description: >-
            Full semantic version string at export (e.g. 1.2.3). Prefer this over
            collapsing to major-only N.0.0 when materializing on import.
        sourceModuleId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Export-time content module UUID. Used to correlate contentModuleReferences
            on a fresh target (do not treat as target identity).
    TemplateExportRenderProfileView:
      type: object
      additionalProperties: false
      description: CE-E01 publish-locked (or version-row) render profile snapshot for v2.
      required: [version, json]
      properties:
        version:
          type: string
          description: Render profile version id (e.g. rp-v1).
        json:
          type: string
          description: Render profile JSON text snapshot (non-secret).
    TemplateExportAssetKeyUsage:
      type: string
      enum: [IMAGE, OTHER]
    LegalHoldScopeType:
      type: string
      description: CE-G04 hold scope (UPPER_SNAKE_CASE; mutually exclusive).
      enum: [TEMPLATE_WINDOW, INVOCATION_SET]
    LegalHoldStatus:
      type: string
      description: CE-G04 hold lifecycle status. Only ACTIVE grants exemption.
      enum: [ACTIVE, RELEASED]
    CreateLegalHoldRequest:
      type: object
      additionalProperties: false
      description: >-
        CE-G04 create body. Exactly one scope; field sets are mutually
        exclusive per docs/behavior/ce-g04-legal-hold.md G04-C3.
      required: [scopeType]
      properties:
        scopeType:
          $ref: '#/components/schemas/LegalHoldScopeType'
        reason:
          type: string
          maxLength: 512
          nullable: true
          description: Optional reason; may appear in management audit summary.
        templateId:
          type: string
          format: uuid
          nullable: true
          description: TEMPLATE_WINDOW — template UUID (or use templateExternalId).
        templateExternalId:
          type: string
          nullable: true
          description: TEMPLATE_WINDOW — template external id (or use templateId).
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
          description: TEMPLATE_WINDOW — UTC window start (required for that scope).
        effectiveTo:
          type: string
          format: date-time
          nullable: true
          description: >-
            TEMPLATE_WINDOW — UTC window end; null means open-ended until release.
        invocationExternalIds:
          type: array
          nullable: true
          minItems: 1
          maxItems: 500
          items:
            type: string
            minLength: 1
          description: INVOCATION_SET — 1…500 invocation external ids.
    LegalHoldView:
      type: object
      additionalProperties: false
      description: CE-G04 legal hold management view (no sensitive payloads).
      required:
        - id
        - holdExternalId
        - scopeType
        - status
        - invocationCount
        - createdAt
        - createdByUsername
      properties:
        id:
          type: string
          format: uuid
        holdExternalId:
          type: string
        scopeType:
          $ref: '#/components/schemas/LegalHoldScopeType'
        status:
          $ref: '#/components/schemas/LegalHoldStatus'
        reason:
          type: string
          nullable: true
        templateId:
          type: string
          format: uuid
          nullable: true
        templateExternalId:
          type: string
          nullable: true
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
        effectiveTo:
          type: string
          format: date-time
          nullable: true
        invocationExternalIds:
          type: array
          items:
            type: string
          description: Empty for TEMPLATE_WINDOW; sorted ids for INVOCATION_SET.
        invocationCount:
          type: integer
          minimum: 0
          maximum: 500
        createdAt:
          type: string
          format: date-time
        createdByUsername:
          type: string
        releasedAt:
          type: string
          format: date-time
          nullable: true
        releasedByUsername:
          type: string
          nullable: true
    LegalHoldPageResponse:
      type: object
      additionalProperties: false
      description: CE-G04 list envelope for `GET /api/management/v1/legal-holds`.
      required: [metadata, result]
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        result:
          allOf:
            - $ref: '#/components/schemas/PageView'
            - type: object
              additionalProperties: false
              required: [content]
              properties:
                content:
                  type: array
                  items:
                    $ref: '#/components/schemas/LegalHoldView'
    LegalHoldResponse:
      type: object
      additionalProperties: false
      description: CE-G04 single-hold envelope (get / create / release).
      required: [metadata, result]
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        result:
          $ref: '#/components/schemas/LegalHoldView'
    AssetLibraryAssetClass:
      type: string
      description: >-
        CE-E02 / ALGI asset class (UPPER_SNAKE_CASE). SEAL is image
        seal/signature asset, not cryptographic e-seal.
      enum: [IMAGE, SEAL, OTHER]
    AssetLibraryAssetStatus:
      type: string
      description: CE-E02 / ALGI catalog row status.
      enum: [ACTIVE, DISABLED]
    AssetLibraryListStatusFilter:
      type: string
      description: >-
        List filter for CE-E02 / ALGI. Omit/`ACTIVE` defaults to ACTIVE-only;
        `ALL` returns ACTIVE ∪ DISABLED.
      enum: [ACTIVE, DISABLED, ALL]
    AssetLibraryAssetView:
      type: object
      additionalProperties: false
      description: >-
        Group-scoped catalog metadata row (CE-E02 + ALGI). Binary bytes are
        never returned. Natural identity is `(groupCode, assetKey)`.
        `assetKey` is the logical binding key used bare in template
        `imageRef`/`sealRef`; physical MinIO object key is
        `{groupCode}/{assetKey}` (± extension candidates).
      required:
        - groupCode
        - assetKey
        - assetClass
        - status
        - contentType
        - sizeBytes
        - contentSha256
        - originalFileName
        - uploadedBy
        - uploadedAt
      properties:
        groupCode:
          type: string
          minLength: 1
          maxLength: 64
          description: Owning business groupCode (trim on write; hard isolation v1).
        assetKey:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9._-]{0,127}$'
          description: >-
            Logical binding key (trim on write). Must not embed a `groupCode/`
            prefix; storage is namespaced separately.
        assetClass:
          $ref: '#/components/schemas/AssetLibraryAssetClass'
        status:
          $ref: '#/components/schemas/AssetLibraryAssetStatus'
        contentType:
          type: string
          description: Stored MIME (`image/png` or `image/jpeg`).
          enum: [image/png, image/jpeg]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 5242880
        contentSha256:
          type: string
          description: Lowercase hex SHA-256 of stored bytes.
          pattern: '^[a-f0-9]{64}$'
        originalFileName:
          type: string
        uploadedBy:
          type: string
          description: Actor username.
        uploadedAt:
          type: string
          format: date-time
    AssetLibraryAssetPageResponse:
      type: object
      additionalProperties: false
      description: >-
        Group-scoped list envelope for `GET /api/management/v1/library/assets`
        (CE-E02 + ALGI).
      required: [metadata, result]
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        result:
          allOf:
            - $ref: '#/components/schemas/PageView'
            - type: object
              additionalProperties: false
              required: [content]
              properties:
                content:
                  type: array
                  items:
                    $ref: '#/components/schemas/AssetLibraryAssetView'
    AssetLibraryAssetResponse:
      type: object
      additionalProperties: false
      description: Group-scoped single-asset envelope (upload / disable; CE-E02 + ALGI).
      required: [metadata, result]
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        result:
          $ref: '#/components/schemas/AssetLibraryAssetView'
    AssetLibraryUploadRequest:
      type: object
      additionalProperties: false
      required: [file, assetKey, assetClass, groupCode]
      properties:
        file:
          type: string
          format: binary
          description: PNG or JPEG bytes; application max 5 MiB.
        assetKey:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9._-]{0,127}$'
        assetClass:
          $ref: '#/components/schemas/AssetLibraryAssetClass'
        groupCode:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            Owning business groupCode (required). Actor must be authorized for
            this group (GLOBAL always). Missing/blank → 422
            `ASSET_LIBRARY_GROUP_CODE_REQUIRED`.
    LibraryExportRequest:
      type: object
      additionalProperties: false
      description: >-
        Optional filters for CE-E03 full-library export. Empty object or omitted
        body = all authorized export-eligible templates. Behavior SoT:
        docs/behavior/ce-e03-full-library-export.md (E03-C4, E03-C5, E03-C12);
        Wave 7 promotion profile: docs/behavior/sys-norm-promotion-pack.md (PP-C3).
      properties:
        groupId:
          type: string
          format: uuid
          description: >-
            When `templateIds` is empty/absent, restrict candidates to this
            group ∩ caller authorization.
        templateIds:
          type: array
          description: >-
            When non-empty, candidates are only these IDs ∩ auth ∩ existence
            (takes precedence over `groupId`). Max 500 items.
          maxItems: 500
          items:
            type: string
            format: uuid
        includeSkipped:
          type: boolean
          default: true
          description: >-
            When true (default), manifest `templates[]` lists SKIPPED rows.
            When false, SKIPPED rows may be omitted from `templates[]` while
            `counts.skippedCount` remains accurate.
        dependencyClosure:
          type: string
          enum: [PROMOTION]
          description: >-
            Optional SYS-NORM Wave 7 promotion dependency-closure profile.
            When `PROMOTION`, each nested template ZIP is a promotion pack and
            root may include deduped `assets/{assetKey}` binaries (PP-C3).
            Absent = default CE-E03 keys-only asset semantics (E03-C10).
    LibraryExportScopeSelection:
      type: string
      description: How the export candidate set was selected (E03-C5 / E03-C11).
      enum: [ALL_AUTHORIZED, GROUP, TEMPLATE_IDS]
    LibraryExportTemplateEntryStatus:
      type: string
      description: >-
        Per-template manifest result (E03-C6). Unauthorized/unknown requested
        IDs are never listed (count only via
        `omittedUnauthorizedOrUnknownCount`).
      enum: [INCLUDED, SKIPPED, FAILED]
    LibraryExportActorView:
      type: object
      additionalProperties: false
      description: Non-sensitive actor summary in the library-export manifest (E03-C11).
      required: [userId]
      properties:
        userId:
          type: string
          description: Authenticated user identifier (non-secret).
        role:
          type: string
          description: Role summary for the exporting actor (non-secret).
    LibraryExportScopeView:
      type: object
      additionalProperties: false
      description: Non-sensitive scope echo in the library-export manifest (E03-C11).
      required: [selection]
      properties:
        selection:
          $ref: '#/components/schemas/LibraryExportScopeSelection'
        groupId:
          type: string
          format: uuid
          nullable: true
          description: Echo when selection is `GROUP` (or group filter applied).
        templateIds:
          type: array
          nullable: true
          description: Echo of requested `templateIds` when selection is `TEMPLATE_IDS`.
          maxItems: 500
          items:
            type: string
            format: uuid
    LibraryExportCountsView:
      type: object
      additionalProperties: false
      description: Aggregate counts in the library-export manifest (E03-C11).
      required:
        - includedCount
        - skippedCount
        - failedCount
        - omittedUnauthorizedOrUnknownCount
        - uniqueMasterCount
        - uniqueClauseCount
        - uniqueAssetKeyCount
      properties:
        includedCount:
          type: integer
          minimum: 0
        skippedCount:
          type: integer
          minimum: 0
        failedCount:
          type: integer
          minimum: 0
        omittedUnauthorizedOrUnknownCount:
          type: integer
          minimum: 0
          description: >-
            Count of requested templateIds that were unauthorized or unknown;
            IDs themselves are not listed (E03-C6).
        uniqueMasterCount:
          type: integer
          minimum: 0
        uniqueClauseCount:
          type: integer
          minimum: 0
        uniqueAssetKeyCount:
          type: integer
          minimum: 0
    LibraryExportTemplateEntryView:
      type: object
      additionalProperties: false
      description: >-
        Manifest `templates[]` row (E03-C6). `FORBIDDEN_OMITTED` IDs are never
        represented here.
      required: [templateId, status]
      properties:
        templateId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/LibraryExportTemplateEntryStatus'
        reasonCode:
          type: string
          description: >-
            Present for SKIPPED / FAILED. Stable examples:
            `EXPORT_NOT_ELIGIBLE` (lifecycle not exportable);
            `PINNED_MASTER_UNAVAILABLE` (entry-level; messageKey reuse
            `api.error.rendering.pinnedMasterUnavailable`).
        path:
          type: string
          description: >-
            Relative ZIP path for INCLUDED rows, e.g.
            `templates/{templateId}.zip`.
    LibraryExportMasterCatalogEntryView:
      type: object
      additionalProperties: false
      description: Deduped master catalog row (E03-C8).
      required: [masterFileHash, sourceTemplateIds, path]
      properties:
        masterFileHash:
          type: string
          description: Lowercase hex SHA-256 of the master DOCX bytes.
          pattern: '^[a-f0-9]{64}$'
        masterRevisionId:
          type: string
          format: uuid
          nullable: true
        revisionSequence:
          type: integer
          nullable: true
        sourceTemplateIds:
          type: array
          items:
            type: string
            format: uuid
        path:
          type: string
          description: Relative ZIP path, e.g. `masters/{masterFileHash}.docx`.
    LibraryExportClauseCatalogEntryView:
      type: object
      additionalProperties: false
      description: Deduped clause catalog row (E03-C9).
      required: [moduleCode, semanticVersion, sourceTemplateIds, path]
      properties:
        moduleCode:
          type: string
        semanticVersion:
          type: string
        sourceModuleId:
          type: string
          format: uuid
          nullable: true
        sourceTemplateIds:
          type: array
          items:
            type: string
            format: uuid
        path:
          type: string
          description: >-
            Relative ZIP path
            `clauses/{moduleCode}__{semanticVersion}.json` (unsafe path
            characters percent-encoded or replaced with `_`; original keys
            retained on this row).
    LibraryExportManifestView:
      type: object
      additionalProperties: false
      description: >-
        Root `library-export-manifest.json` for
        `template-library-export-v1-zip` (E03-C1, E03-C11). Must not contain
        secrets, credentials, test-data variable values, or asset binaries.
      required:
        - format
        - exportBatchId
        - exportedAt
        - bundleVersion
        - actor
        - scope
        - counts
        - templates
        - masterCatalog
        - clauseCatalog
        - assetKeyManifest
      properties:
        format:
          type: string
          description: Library export format constant.
          enum: [template-library-export-v1-zip]
        exportBatchId:
          type: string
          format: uuid
        exportedAt:
          type: string
          format: date-time
          description: UTC ISO-8601 export timestamp.
        bundleVersion:
          type: integer
          enum: [2]
          description: Nested per-template packs are always E01 v2.
        actor:
          $ref: '#/components/schemas/LibraryExportActorView'
        scope:
          $ref: '#/components/schemas/LibraryExportScopeView'
        counts:
          $ref: '#/components/schemas/LibraryExportCountsView'
        templates:
          type: array
          items:
            $ref: '#/components/schemas/LibraryExportTemplateEntryView'
        masterCatalog:
          type: array
          items:
            $ref: '#/components/schemas/LibraryExportMasterCatalogEntryView'
        clauseCatalog:
          type: array
          items:
            $ref: '#/components/schemas/LibraryExportClauseCatalogEntryView'
        assetKeyManifest:
          type: array
          description: >-
            Union of asset keys from INCLUDED E01 v2 bundles (key + usage only)
            (E03-C10). Default export has no root asset binary tree; when
            `dependencyClosure=PROMOTION`, binaries may appear under
            `assets/{assetKey}` while this manifest still lists keys.
          items:
            $ref: '#/components/schemas/TemplateExportAssetKeyManifestItemView'
    TemplateExportAssetKeyManifestItemView:
      type: object
      additionalProperties: false
      description: CE-E01 asset key inventory item (key only; no binary payload).
      required: [referenceKey, usage]
      properties:
        referenceKey:
          type: string
          description: Object-storage or structured-content reference key.
        usage:
          $ref: '#/components/schemas/TemplateExportAssetKeyUsage'
    TemplateExportBundleView:
      type: object
      additionalProperties: false
      description: >-
        Template export bundle. v1 uses format `template-export-bundle-v1-json`.
        v2 (CE-E01) uses `template-export-bundle-v2-json` and includes
        `masterPin`, `clauseSnapshots`, optional `renderProfile`, and
        `assetKeyManifest`. Promotion packs (Wave 7 `dependencyClosure=PROMOTION`)
        may additionally include `clauseNestingGraph` and ZIP-only asset binaries
        under `artifacts/assets/{assetKey}` (not inlined in JSON). Must never
        embed DocumentBrand/LegalEntity sidecars or secrets. Behavior SoT:
        docs/behavior/ce-e01-export-bundle-v2.md;
        docs/behavior/sys-norm-promotion-pack.md.
      required:
        - format
        - metadata
        - variables
        - bindings
        - rules
        - contentModuleReferences
      properties:
        format:
          type: string
          description: Bundle format constant (v1 or v2).
          enum:
            - template-export-bundle-v1-json
            - template-export-bundle-v2-json
        metadata:
          $ref: '#/components/schemas/TemplateExportMetadataView'
        variables:
          type: array
          items:
            $ref: '#/components/schemas/TemplateExportVariableSchemaView'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/TemplateExportAnchorBindingView'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/TemplateExportCompositionRuleView'
        compositionInclusionRules:
          type: array
          description: >-
            ADR-0063 / IBL-E2. Structured jurisdiction/product/channel inclusion
            rules (orthogonal to visibility `rules`). Absent or empty = no
            inclusion rules (all pinned CMs default INCLUDE).
          items:
            $ref: '#/components/schemas/TemplateExportCompositionInclusionRuleView'
        contentModuleReferences:
          type: array
          items:
            $ref: '#/components/schemas/TemplateExportContentModuleReferenceView'
        policySnapshot:
          $ref: '#/components/schemas/TemplateExportApiPolicySnapshot'
          nullable: true
        masterPin:
          $ref: '#/components/schemas/TemplateExportMasterPinView'
          nullable: true
          description: Required for v2 format; omit on v1.
        clauseSnapshots:
          type: array
          description: >-
            Required for v2 (may be empty); omit on v1. Under promotion closure,
            must include transitive nesting closure when nested modules exist
            (PP-C2; depth ≤ 8).
          items:
            $ref: '#/components/schemas/TemplateExportClauseSnapshotView'
        renderProfile:
          $ref: '#/components/schemas/TemplateExportRenderProfileView'
          nullable: true
          description: Optional on v2; absent → dry-run INFO `RENDER_PROFILE_ABSENT`.
        assetKeyManifest:
          type: array
          description: >-
            Required for v2 (may be empty); omit on v1. Default E01 v2: keys only
            (no binaries in ZIP). Promotion: keys remain; binaries live under
            ZIP path `artifacts/assets/{assetKey}`.
          items:
            $ref: '#/components/schemas/TemplateExportAssetKeyManifestItemView'
        clauseNestingGraph:
          $ref: '#/components/schemas/TemplateExportClauseNestingGraphView'
          nullable: true
          description: >-
            Optional Wave 7 promotion field (PP-C2). Present when nested content
            modules exist under promotion export; non-nested templates may omit
            or emit empty edges. Cycles / depth > 8 fail closed at export.
        dependencyClosure:
          type: string
          enum: [PROMOTION]
          nullable: true
          description: >-
            Optional Wave 7 marker written into promotion ZIP bundle JSON when
            export used `dependencyClosure=PROMOTION`. Import dry-run prefers
            this field over asset/nesting heuristics for promotion-carrier
            detection. Absent on default E01/E03 bundles. JSON export rejects
            query `dependencyClosure=PROMOTION` (requires `format=zip`).
    TemplateExportResult:
      type: object
      additionalProperties: false
      required: [format, bundle]
      properties:
        format:
          type: string
          enum:
            - template-export-bundle-v1-json
            - template-export-bundle-v2-json
        bundle:
          $ref: '#/components/schemas/TemplateExportBundleView'
    TemplateExportResponse:
      type: object
      additionalProperties: false
      required: [metadata, result]
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        result:
          $ref: '#/components/schemas/TemplateExportResult'
    ImportTemplateRequest:
      type: object
      additionalProperties: false
      required: [masterId, bundle]
      properties:
        masterId:
          type: string
          format: uuid
          description: Target environment master document UUID; must be APPROVED and group-compatible.
        bundle:
          $ref: '#/components/schemas/TemplateExportBundleView'
        importConflictPolicy:
          $ref: '#/components/schemas/TemplateImportConflictPolicy'
        dryRun:
          type: boolean
          default: false
          description: >-
            CE-E01: when true, return dependency pre-check report only (HTTP 200);
            no business-table writes. When false/omitted, commit import (or 422
            if blocking dependencies remain). v2 JSON-only bundles may dry-run;
            self-contained commit requires multipart ZIP with `artifacts/master.docx`.
    ImportTemplateMultipartRequest:
      type: object
      additionalProperties: false
      description: >-
        CE-E01 normative ZIP import carrier (multipart). Prefer this for v2
        self-contained commit. Optional raw `Content-Type: application/zip`
        whole-body POST is a non-normative equivalent implementation.
      required: [masterId, file]
      properties:
        masterId:
          type: string
          format: uuid
        file:
          type: string
          format: binary
          description: >-
            ZIP archive (`template-export-bundle.json` [+ `artifacts/master.docx`
            for v2]; promotion packs may also include `artifacts/assets/{assetKey}`).
        importConflictPolicy:
          $ref: '#/components/schemas/TemplateImportConflictPolicy'
        dryRun:
          type: boolean
          default: false
    TemplateExportClauseNestingGraphEdgeView:
      type: object
      additionalProperties: false
      description: >-
        One nesting edge in a promotion-pack `clauseNestingGraph` (PP-C2 / ADR-0067).
      required: [parentModuleCode, childModuleCode, depth]
      properties:
        parentModuleCode:
          type: string
          description: Parent content-module code in the nesting graph.
        childModuleCode:
          type: string
          description: Child content-module code nested under the parent.
        depth:
          type: integer
          minimum: 1
          maximum: 8
          description: Nesting depth of this edge (≤ 8; ADR-0067).
    TemplateExportClauseNestingGraphView:
      type: object
      additionalProperties: false
      description: >-
        Machine-readable clause nesting closure for promotion packs (PP-C2).
        Edges + depth only; no clause full text.
      required: [edges]
      properties:
        edges:
          type: array
          items:
            $ref: '#/components/schemas/TemplateExportClauseNestingGraphEdgeView'
        maxDepth:
          type: integer
          minimum: 0
          maximum: 8
          description: Optional observed max depth in the exported closure.
    TemplateImportDependencyType:
      type: string
      description: >-
        Dependency category in dry-run / commit reports. Wave 7 adds
        `CLAUSE_NESTING` and `ASSET_BINARY` (additive; PP-C10). Implementers may
        also reuse `ASSET_KEY` with codes `ASSET_WILL_MATERIALIZE` /
        `ASSET_BINARY_ABSENT`.
      enum:
        - MASTER_PIN
        - CLAUSE
        - ASSET_KEY
        - RENDER_PROFILE
        - BUNDLE_FORMAT
        - CLAUSE_NESTING
        - ASSET_BINARY
    TemplateImportDependencySeverity:
      type: string
      description: >-
        Item severity. `MISSING` / `MISMATCH` are blocking unless noted otherwise
        in behavior SoT; `WILL_MATERIALIZE` and `INFO` are non-blocking;
        `OK` is success.
      enum: [OK, MISSING, MISMATCH, WILL_MATERIALIZE, INFO]
    TemplateImportDependencyItemView:
      type: object
      additionalProperties: false
      required: [dependencyType, severity, code, messageKey]
      properties:
        dependencyType:
          $ref: '#/components/schemas/TemplateImportDependencyType'
        severity:
          $ref: '#/components/schemas/TemplateImportDependencySeverity'
        code:
          type: string
          description: Stable UPPER_SNAKE code (e.g. MASTER_FINGERPRINT_MISMATCH, MASTER_DOCX_ABSENT).
          pattern: '^[A-Z][A-Z0-9_]*$'
        messageKey:
          type: string
          description: English-first i18n key (e.g. api.error.template.dep.masterFingerprintMismatch).
        detail:
          type: string
          nullable: true
          description: Non-sensitive detail (no clause body, secrets, or DOCX bytes).
    TemplateImportDependencyReportView:
      type: object
      additionalProperties: false
      description: CE-E01 import dependency pre-check report (dry-run 200 or commit 422).
      required:
        - items
        - blockingCount
        - warningCount
        - infoCount
        - readyToCommit
