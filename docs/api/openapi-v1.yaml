      summary: List recent template batch-test history (CE-U18 sampleResults)
      description: >-
        Returns the most recent non-hidden batch-test runs for a template
        (default limit 5; P12 soft-hide retention). Each summary includes
        coverage/gate fields and CE-U18 `sampleResults` derived from persisted
        `sampleResultsJson` so the management UI can expand per-sample detail
