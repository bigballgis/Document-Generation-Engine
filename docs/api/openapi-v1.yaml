        effectiveFrom:
          type: string
          format: date-time
          description: CE-K08 optional effective-from Instant (UTC).
        effectiveTo:
          type: string
          format: date-time
          description: CE-K08 optional effective-to Instant (UTC). Null = no expiry.
        legalReviewRef:
          type: string
          maxLength: 128
          description: CE-K08 optional legal review reference (trim; blank → null).
