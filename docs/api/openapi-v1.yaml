  /api/management/v1/templates/{templateId}/export:
    get:
      tags: [Admin]
      operationId: exportTemplateBundle
      summary: Export a template as JSON or ZIP bundle
      description: >-
        Exports an eligible template (`PENDING_RELEASE`, `PUBLISHED`, `STOPPED`,
        or `DEPRECATED`) as `template-export-bundle-v1-json` by default, or
        `template-export-bundle-v2-json` when `bundleVersion=2` (CE-E01).
        JSON responses use the management success envelope; ZIP responses
        (`format=zip`) return an `application/zip` attachment. v1 ZIP contains
        only `template-export-bundle.json`. v2 ZIP additionally embeds
        `artifacts/master.docx` (pinned master revision bytes) and the JSON
        carries `masterPin`, `clauseSnapshots`, `renderProfile`, and
        `assetKeyManifest`. When `dependencyClosure=PROMOTION` (SYS-NORM Wave 7;
        requires `bundleVersion=2` and `format=zip`), the ZIP is a UAT→PROD
        promotion pack: embeds asset binaries under `artifacts/assets/{assetKey}`,
        includes transitive clause nesting closure + optional `clauseNestingGraph`,
        and never includes DocumentBrand/LegalEntity sidecars or secrets. Omitting
        `dependencyClosure` preserves default CE-E01 v2 keys-only semantics
        (E01-C7). Bundle omits secrets, API credential material, and runtime
        credentials. Permission boundary per permission-matrix section 5:
        `GLOBAL_ADMIN` (all templates), `GROUP_ADMIN` (authorized groups),
        `DOCUMENT_AUTHOR` (own templates only). Export actions are audited.
        Traceability: BDD-CE-E01-001…006; docs/behavior/ce-e01-export-bundle-v2.md;
        Wave 7 BDD-SYS-NORM-PP-001…006; docs/behavior/sys-norm-promotion-pack.md.
        When the pinned master DOCX object is unavailable at export time, fail-closed
        with `PINNED_MASTER_UNAVAILABLE` /
        `api.error.rendering.pinnedMasterUnavailable` (reuse CE-K01 / CE-G06 key).
        Nesting cycle/depth violations under promotion closure fail closed (IBL-E6
        code family). Missing asset object bytes under promotion closure fail closed.
      parameters:
        - name: templateId
          in: path
          required: true
          description: Internal template resource UUID (management path).
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          description: When `zip`, returns a ZIP attachment instead of the JSON envelope.
          schema:
            type: string
            enum: [zip]
        - name: bundleVersion
          in: query
          required: false
          description: >-
            Export bundle schema generation. `1` (default) =
            `template-export-bundle-v1-json`. `2` (CE-E01) =
            `template-export-bundle-v2-json` with self-contained ZIP artifacts.
          schema:
            type: integer
            enum: [1, 2]
            default: 1
        - name: dependencyClosure
          in: query
          required: false
          description: >-
            Optional promotion dependency-closure profile (SYS-NORM Wave 7).
            When `PROMOTION`, export embeds asset binaries and clause nesting
            closure (PP-C1/C2). Requires `bundleVersion=2` and `format=zip`.
            Absent = default CE-E01 / non-promotion behavior.
          schema:
            type: string
            enum: [PROMOTION]
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Template export bundle (JSON envelope) or ZIP attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateExportResponse'
            application/zip:
              schema:
                type: string
                format: binary
              description: >-
                ZIP archive. v1: entry `template-export-bundle.json` only.
                v2 (CE-E01): `template-export-bundle.json` plus
                `artifacts/master.docx`. Promotion (`dependencyClosure=PROMOTION`):
                additionally `artifacts/assets/{assetKey}` binaries (path-safe
                encoding; manifest retains original key).
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/management/v1/templates/{templateId}/compute-expressions/validate:
    post:
      tags: [Admin]
      operationId: validateComputeExpression
      summary: Validate a whitelist compute expression (syntax + references)
      description: >-
        CE-K03 author-time validation for `computeExpression` values. Checks
        whitelist DSL syntax, length/nesting bounds, and that `${path}` roots
        exist in `knownVariableKeys`. Returns `valid`/`message` in the success
        envelope (does not throw for invalid expressions). Does not evaluate
        sample data or produce a document.

        Whitelist `FORMAT_AMOUNT` forms (IBL-A2): `FORMAT_AMOUNT(value)` keeps
        locale-default currency; optional `FORMAT_AMOUNT(value, currencyCode)`
        takes an ISO 4217 alphabetic code (e.g. `EUR`) — not a locale tag.
        Number/grouping localization still follows request `context.locale`
        (default `zh-CN`). Blank/invalid currency on the binary form fails
        evaluation as `VARIABLE_COMPUTE_FAILED` (see evaluate). Behavior SoT:
        docs/behavior/ibl-a2-format-amount-currency.md (BDD-IBL-A2-001…010).

        Whitelist `SPELL_AMOUNT` forms (IBL-A3): `SPELL_AMOUNT(value)` is always
        CNY Chinese uppercase (locale-independent). Optional
        `SPELL_AMOUNT(value, currencyCode)` takes an ISO 4217 alphabetic code;
        spelling language comes from `context.locale` primary language.
        Required supported pairs this leaf: `(en, USD)` and `(zh, CNY)`.
        Unsupported (language, currency) pair, illegal/blank currency, or
        arity ∉ {1,2} → `VARIABLE_COMPUTE_FAILED` (no silent wrong-language
        fallback). Behavior SoT:
        docs/behavior/ibl-a3-amount-in-words.md (BDD-IBL-A3-001…012).
        Traceability: BDD-CE-K03-024…025; ADR-0056; IBL-A2; IBL-A3.
      parameters:
        - name: templateId
          in: path
          required: true
          description: Internal template resource UUID (management path).
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeExpressionValidateRequest'
      responses:
        '200':
          description: Compute expression validation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeExpressionValidateResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/management/v1/templates/{templateId}/compute-expressions/evaluate:
    post:
      tags: [Admin]
      operationId: evaluateComputeExpression
      summary: Evaluate a compute expression against sample variables (author preview)
      description: >-
        CE-K03 author-time sample evaluation for compute preview. Evaluates the
        whitelist expression against `sampleVariables` (optional `locale`) and
        returns a non-sensitive result summary. Failures surface as
        `VARIABLE_COMPUTE_FAILED` (422) with `variableKey` + `expressionSummary`
        — never as a successful document. Does not assemble DOCX/PDF.

        Whitelist `FORMAT_AMOUNT` forms (IBL-A2): unary `FORMAT_AMOUNT(value)`
        uses locale-default currency; binary `FORMAT_AMOUNT(value, currencyCode)`
        uses ISO 4217 alphabetic currency while locale formatting still follows
        optional `locale` / `context.locale`. Missing, blank, or invalid
        `currencyCode` → `VARIABLE_COMPUTE_FAILED` (no silent locale-default
        fallback). Second argument is never a locale tag. Behavior SoT:
        docs/behavior/ibl-a2-format-amount-currency.md (BDD-IBL-A2-001…010).

        Whitelist `SPELL_AMOUNT` forms (IBL-A3): unary `SPELL_AMOUNT(value)` is
        always CNY Chinese uppercase (ignores locale language). Binary
        `SPELL_AMOUNT(value, currencyCode)` uses ISO 4217 currency identity +
        `locale` / `context.locale` primary language for spelling. At least
        `(en, USD)` and `(zh, CNY)` must succeed; unsupported pair, illegal/
        blank currency, or bad arity → `VARIABLE_COMPUTE_FAILED` (no silent
        wrong-language fallback). Behavior SoT:
        docs/behavior/ibl-a3-amount-in-words.md (BDD-IBL-A3-001…012).
        Traceability: BDD-CE-K03-026…027; ADR-0056; IBL-A2; IBL-A3.
      parameters:
        - name: templateId
          in: path
          required: true
          description: Internal template resource UUID (management path).
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeExpressionEvaluateRequest'
      responses:
        '200':
          description: Sample compute evaluation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeExpressionEvaluateResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/management/v1/templates/import:
    post:
      tags: [Admin]
      operationId: importTemplateBundle
      summary: Import a template export bundle into DRAFT (or dry-run dependency pre-check)
      description: >-
        Imports a validated `template-export-bundle-v1-json` or
        `template-export-bundle-v2-json` (CE-E01) bundle, including Wave 7
        promotion packs when embedded assets/nesting graph are present
        (auto-detect; no separate import profile flag). Imported templates land
        in `DRAFT` and must re-run test, approval, and publish in the target
        environment — never PUBLISHED / PENDING_RELEASE via import. `masterId`
        must reference an `APPROVED` master in the same `groupCode` as bundle
        metadata when binding an existing master. `importConflictPolicy` defaults
        to `REJECT_IMPORT` when omitted. `KEEP_TEMPLATE_ID` applies only when the
        internal template UUID in bundle metadata already exists; conflicting
        `externalId` always rejects import. When `dryRun=true`, the API returns
        a dependency pre-check report (`dependencyReport`) with HTTP 200 and
        performs no business-table writes (CE-E01 / PP-C9). Commit import with
        blocking unmet dependencies returns 422
        `api.error.template.importDependenciesUnsatisfied` with the same report
        shape — never a half-imported state. v2 may materialize missing clause
        snapshots as DRAFT content-module versions inside a single transaction.
        Promotion packs may also materialize CE-E02 library assets from embedded
        binaries and, when configured/allowed, a missing master from embedded
        DOCX as **DRAFT only** (two-phase P2 — never skip APPROVED; PP-C6).
        Additive report `dependencyType` values: `CLAUSE_NESTING`, `ASSET_BINARY`
        (or `ASSET_KEY` with codes `ASSET_WILL_MATERIALIZE` / `ASSET_BINARY_ABSENT`).
        Non-promotion v1/v2 fail-closed semantics must not regress. Permission
        boundary per permission-matrix section 5 matches export (no new codes).
        Import and dry-run actions are audited; successful commit returns
        `importBatchId`. Traceability: BDD-CE-E01-007…017;
        docs/behavior/ce-e01-export-bundle-v2.md; BDD-SYS-NORM-PP-007…019;
        docs/behavior/sys-norm-promotion-pack.md.
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportTemplateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportTemplateMultipartRequest'
            encoding:
              file:
                contentType: application/zip
      responses:
        '200':
          description: >-
            CE-E01 dry-run (`dryRun=true`): dependency pre-check report only;
            `imported=false`; no business-table writes. Audit
            `TEMPLATE_IMPORT_DRY_RUN` still recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateImportDryRunResponse'
        '201':
          description: Template imported; lands in DRAFT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateImportResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          description: >-
            Validation / dependency gate failure. For unmet blocking import
            dependencies, `error.code=IMPORT_DEPENDENCIES_UNSATISFIED` and
            `error.messageKey=api.error.template.importDependenciesUnsatisfied`
            with `error.dependencyReport` (same shape as dry-run).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
