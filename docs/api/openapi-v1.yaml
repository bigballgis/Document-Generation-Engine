      type: apiKey
      in: header
      name: X-Api-Credential-Id
      description: Non-secret API credential identifier.
    ApiCredentialSecret:
      type: apiKey
      in: header
      name: X-Api-Credential-Secret
      description: API credential secret. It must not be logged, audited, returned, or displayed after submission.
    AccessAccount:
      type: apiKey
      in: header
      name: X-Access-Account
      description: User or service account whose AD Group membership is evaluated.
  parameters:
    Environment:
      name: environment
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        pattern: '^TPL-[A-Za-z0-9-]+$'
      example: TPL-LOAN-NOTICE
    ReleaseVersion:
      name: releaseVersion
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
      example: 1.0.0
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        pattern: '^TASK-[A-Za-z0-9]+$'
      example: TASK-7K3M9Q2R
    TaskQueryRequestId:
      name: requestId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Optional caller request tracking ID for task query. Audited for tracing only and not used for task lookup or idempotency.
    InvocationId:
      name: invocationId
      in: path
      required: true
      schema:
        type: string
        pattern: '^INV-[A-Za-z0-9]+$'
      example: INV-7K3M9Q2R
    InvocationViewQuery:
      name: view
      in: query
      required: false
      schema:
        type: string
        enum: [logical, flat]
        default: logical
      description: logical returns SINGLE, BATCH_ROOT, ASYNC_TASK; flat returns SINGLE and BATCH_ITEM only.
    InvocationRequestIdQuery:
      name: requestId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Filter by caller requestId. Not used for idempotency resolution on this endpoint.
    InvocationPageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    InvocationSizeQuery:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CatalogPageQuery:
      name: page
      in: query
      required: false
      description: >-
        Zero-based page index (LR-C5 catalog lists). Default 0; negative values
        normalize to 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    CatalogSizeQuery:
      name: size
      in: query
      required: false
      description: >-
        Page size for catalog lists (LR-C5). Default 20; legal range 1…100.
        Missing or out-of-range values normalize per BDD C5-C2 (default 20 or
        clamp >100 to 100 — implementation locks one; must not 500).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CatalogSearchQuery:
      name: search
      in: query
      required: false
      description: >-
        Optional case-insensitive contains search. Empty/blank ignored.
        Field coverage is entity-specific (see operation description).
        Reusable by future LR-C6 command palette; this contract does not define
        a separate C6 palette API.
      schema:
        type: string
        minLength: 1
    CatalogGroupCodeQuery:
      name: groupCode
      in: query
      required: false
      description: >-
        Exact-match group filter (trim). Intersected with session-authorized
        groups; unauthorized group yields empty page (no cross-group leak).
      schema:
        type: string
        minLength: 1
        maxLength: 64
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        pattern: '^DOC-[A-Za-z0-9]+$'
      example: DOC-8F2N6P4Q
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TemplateIdQuery:
      name: templateId
      in: query
      required: false
      schema:
        type: string
        pattern: '^TPL-[A-Za-z0-9-]+$'
      example: TPL-LOAN-NOTICE
    EventTypeQuery:
      name: eventType
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    CredentialIdQuery:
      name: credentialId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    EventAtFromQuery:
      name: eventAtFrom
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Inclusive lower bound of event timestamp filter in ISO-8601 format. When both eventAtFrom and eventAtTo are provided, eventAtFrom must be less than or equal to eventAtTo.
    EventAtToQuery:
      name: eventAtTo
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Inclusive upper bound of event timestamp filter in ISO-8601 format. When both eventAtFrom and eventAtTo are provided, eventAtFrom must be less than or equal to eventAtTo.
    AuditActorRoleQuery:
      name: actorRole
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AuditReadActorRole'
      description: >-
        Audit read actor role for admin audit read/export endpoints.
        Allowed values: AUDIT_ADMIN, GLOBAL_ADMIN, GROUP_ADMIN.
        GROUP_ADMIN requires both groupScope and templateId.
    GroupScopeQuery:
      name: groupScope
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Required when actorRole is GROUP_ADMIN for management audit read, management audit export, and lifecycle audit read; GROUP_ADMIN requests must provide both groupScope and templateId.
    TraceIdHeader:
      name: X-Trace-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
      description: Optional caller trace ID. If omitted, the platform generates traceId.
  headers:
    AuditId:
      schema:
        type: string
    TraceId:
      schema:
        type: string
    RequestId:
      schema:
        type: string
    IdempotencyKey:
      schema:
        type: string
    IdempotencyStatus:
      schema:
        $ref: '#/components/schemas/IdempotencyStatus'
    DocumentId:
      schema:
        type: string
    TemplateId:
      schema:
        type: string
    RouteType:
      schema:
        $ref: '#/components/schemas/RouteType'
    ResolvedReleaseVersion:
      schema:
        type: string
    OutputFormat:
      schema:
        $ref: '#/components/schemas/OutputFormat'
    OutputMode:
      schema:
        $ref: '#/components/schemas/OutputMode'
    FidelityWarningCount:
      description: >-
        SYNC_STREAM header summary only. Count of fidelity warnings for this generation
        (equals JSON-path `fidelityWarnings` array length when the same generation is returned as JSON).
        Full warning objects are never placed in the SYNC_STREAM response body; see contract-outline
        «保真警告响应确认» / CE-C03.
      schema:
        type: integer
        minimum: 0
    FidelityWarningCodes:
      description: >-
        SYNC_STREAM header summary only. Comma-separated `FidelityWarningCode` values in generation
        order (empty string when count is 0). Same code set as JSON-path `fidelityWarnings[].warningCode`.
        Full `FidelityWarning` objects are returned only on JSON batch/task/`DownloadUrlResponse` success
        paths — not in the file-stream body.
      schema:
        type: string
  responses:
    AsyncAccepted:
      description: Async task accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AsyncAcceptedResponse'
    ErrorResponse:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    RouteAccessDeniedRequest:
      type: object
      additionalProperties: false
      required: [routeKey, traceId]
      properties:
        routeKey:
          type: string
          minLength: 1
          maxLength: 256
          description: Logical management route key (preferred) or path summary.
          example: route.audit-console
        traceId:
          type: string
          minLength: 1
          maxLength: 128
          description: Client-side denial correlation id (no secrets).
    OutputFormat:
      type: string
      enum: [DOCX, PDF]
    OutputMode:
      type: string
      enum: [SYNC_STREAM, SYNC_DOWNLOAD_URL, ASYNC_TASK]
    RouteType:
      type: string
      enum: [EXPLICIT_VERSION, DEFAULT_ROUTE]
    FidelityWarningCode:
      type: string
      description: >-
        Caller-visible fidelity warning codes for runtime success paths (JSON `fidelityWarnings[].warningCode`
        and SYNC_STREAM `fidelityWarningCodes` header). Baseline ADR-0019 codes plus engine-emitted codes
        that may appear on the formal runtime success path (CE-C03 honest enum). Includes
        DOCX_PERMISSIONS_NOT_APPLIED (CE-C06) when DOCX requests non-empty encryption.permissions;
        JSON path `messageKey` for that code is
        generation.warning.fidelity.docxPermissionsNotApplied.
      enum:
        - OPTIONAL_CONTENT_EMPTY
        - LOW_RISK_PAGINATION_DIFFERENCE
        - LOW_RISK_TABLE_PAGE_BREAK
        - CONTROLLED_STYLE_FALLBACK
        - IMAGE_SCALING_ADJUSTED
        - MASTER_STYLE_FALLBACK
        - PARTIAL_TABLE_LAYOUT_ADJUSTMENT
        - UNRESOLVED_VARIABLE
        - INVALID_CONDITION_EXPRESSION
        - MISSING_ANCHOR_CONTENT
        - UNSUPPORTED_NODE
        - MISSING_STYLE_REFERENCE
        - INAPPLICABLE_STYLE
        - DIRECT_FORMAT_OUT_OF_WHITELIST
        - DIRECT_FORMAT_GLOBAL_LAYOUT
        - DIRECT_FORMAT_INVALID_VALUE
        - NESTED_TABLE
        - UNRELIABLE_TABLE_LAYOUT
        - INVALID_TABLE_COMPONENT
        - SEAL_OUTSIDE_AUTHORIZED_AREA
        - SEAL_AUTHORIZED_AREA_UNKNOWN
        - SEAL_AUTHORIZED_AREA_INVALID
        - SEAL_PLACEMENT_GEOMETRY_INVALID
        - SEAL_SCALING_NOT_ALLOWED
        - MISSING_REFERENCE_KEY
        - DUPLICATE_NUMBER
        - BROKEN_NUMBER_CROSS_REFERENCE
        - PDF_PAGE_NUMBER_STAMP_FAILED
        - PDF_PAGE_NUMBER_STAMP_SKIPPED_FOR_PDFA
        - DOCX_PERMISSIONS_NOT_APPLIED
    IdempotencyStatus:
      type: string
      enum: [IDEMPOTENCY_NEW, IDEMPOTENCY_REPLAYED, IDEMPOTENCY_CONFLICTED]
    TaskStatus:
      type: string
      enum: [ACCEPTED, PROCESSING, SUCCEEDED, FAILED, PARTIAL_SUCCEEDED, EXPIRED, CANCELLED]
    BatchItemStatus:
      type: string
      enum: [SUCCEEDED, FAILED, SKIPPED]
    Permission:
      type: string
      enum: [ALLOW_PRINT, ALLOW_COPY, ALLOW_EDIT, ALLOW_ANNOTATE, ALLOW_FORM_FILL]
    Context:
      type: object
      additionalProperties: false
      description: >-
        Safe whitelist (ADR-0013 amended by ADR-0063 / IBL-E2, ADR-0065 /
        IBL-E4, and ADR-0071 / SYS-NORM Wave 6). Optional `jurisdiction` /
        `product` plus existing `channel` may drive Composition Inclusion
        Rules. Optional `legalEntityCode` is whitelist-accepted when present
        but MUST NOT drive LegalEntity→DocumentBrand catalog resolve (not
        package selection; not UI chrome). Unknown fields → 400
        REQUEST_BODY_INVALID. Must not carry PII, amounts, or template
        variable plaintext.
      properties:
        sourceSystem:
          type: string
        channel:
          type: string
          description: >-
            Call-channel tracing/stats; also a composition inclusion match axis
            (ADR-0063). Not outbound delivery channel (PD-1).
        businessRequestId:
          type: string
        upstreamTraceId:
          type: string
        scenario:
          type: string
        locale:
          type: string
          description: Compute / language-compatibility hint (ADR-0056 / ADR-0062); not an IBL-E2 composition axis.
        jurisdiction:
          type: string
          description: >-
            Optional composition axis (ADR-0063). Trim; blank → absent; suggested
            maxLength 128; case-insensitive exact match against inclusion rules.
          maxLength: 128
        product:
          type: string
          description: >-
            Optional composition axis (ADR-0063). Same normalization/match rules
            as jurisdiction.
          maxLength: 128
        legalEntityCode:
          type: string
          description: >-
            Optional opaque non-PII context field (ADR-0013 whitelist; historical
            ADR-0065 axis). After ADR-0071 / SYS-NORM Wave 6: whitelist-accepted when
            present; MUST NOT drive LegalEntity→DocumentBrand catalog resolve; MUST
            NOT produce retired catalog 422 codes (LEGAL_ENTITY_UNKNOWN /
            LEGAL_ENTITY_INACTIVE / DOCUMENT_BRAND_INACTIVE /
            DOCUMENT_BRAND_NOT_ALLOWED / DOCUMENT_BRAND_UNKNOWN); MUST NOT change UI
            chrome. Omitted remains valid. Letterhead/logo/seal from Letterhead
            (master). Does not select template packages.
          maxLength: 64
    OutputOptions:
      type: object
      additionalProperties: false
      required: [format, mode]
      properties:
        format:
          $ref: '#/components/schemas/OutputFormat'
        mode:
          $ref: '#/components/schemas/OutputMode'
    EncryptionOptions:
      type: object
      description: >-
        Dynamic encryption options. When enabled is true, openPassword is
        required. When permissions are provided, ownerPassword is required.
        When enabled is false, openPassword, ownerPassword, and permissions are
        not allowed. openPassword and ownerPassword must be different when both
        are present. permissions apply only when output.format is PDF (CE-C06);
        for DOCX (non-PDF), a non-empty permissions array that passes structural
        validation does not map to document protection — generation succeeds with
        fidelity warning DOCX_PERMISSIONS_NOT_APPLIED
        (messageKey generation.warning.fidelity.docxPermissionsNotApplied).
        Apache POI DOCX write-protect is out of scope for CE-C06. DOCX
        openPassword encryption remains supported.
      additionalProperties: false
      required: [enabled]
      allOf:
        - if:
            properties:
              enabled:
                const: true
            required: [enabled]
          then:
            required: [openPassword]
        - if:
            properties:
              enabled:
                const: false
            required: [enabled]
          then:
            not:
              anyOf:
                - required: [openPassword]
                - required: [ownerPassword]
                - required: [permissions]
        - if:
            required: [permissions]
          then:
            required: [ownerPassword]
      properties:
        enabled:
          type: boolean
        openPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
        ownerPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
        permissions:
          type: array
          description: >-
            Abstract allow-list permissions. Applied only for PDF output.
            For DOCX, non-empty values are accepted structurally (ownerPassword
            still required) but ignored for file protection; callers receive
            DOCX_PERMISSIONS_NOT_APPLIED on the success path with messageKey
            generation.warning.fidelity.docxPermissionsNotApplied.
          items:
            $ref: '#/components/schemas/Permission'
          uniqueItems: true
    Variables:
      type: object
      description: Template variables constrained by the selected release version variable schema.
      additionalProperties: true
    GenerateRequest:
      type: object
      additionalProperties: false
      required: [output, variables, requestId, idempotencyKey]
      properties:
        output:
          $ref: '#/components/schemas/OutputOptions'
        variables:
          $ref: '#/components/schemas/Variables'
        encryption:
          $ref: '#/components/schemas/EncryptionOptions'
        requestId:
          type: string
        idempotencyKey:
          type: string
        context:
          $ref: '#/components/schemas/Context'
    BatchGenerateRequest:
      type: object
      additionalProperties: false
      required: [output, items, requestId, idempotencyKey]
      properties:
        output:
          $ref: '#/components/schemas/OutputOptions'
        encryption:
          $ref: '#/components/schemas/EncryptionOptions'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BatchGenerateItem'
        requestId:
          type: string
        idempotencyKey:
          type: string
        originalBatchId:
          type: string
          pattern: '^BATCH-[A-Za-z0-9]+$'
          description: >
            Optional retry lineage. When present, must identify an existing BATCH_ROOT
            batch owned by the same API credential; otherwise 404 ORIGINAL_BATCH_NOT_FOUND.
            On success, echoed on result.batch.originalBatchId. Does not mutate the original batch.
            See CE-C05 / docs/behavior/ce-c05-original-batch-id.md.
        context:
          $ref: '#/components/schemas/Context'
    BatchGenerateItem:
      type: object
      additionalProperties: false
      required: [itemId, variables]
      properties:
        itemId:
          type: string
        variables:
          $ref: '#/components/schemas/Variables'
        output:
          $ref: '#/components/schemas/OutputOptions'
        encryption:
          $ref: '#/components/schemas/EncryptionOptions'
    Metadata:
      type: object
      additionalProperties: false
      required: [auditId, traceId]
      properties:
        auditId:
          type: string
        traceId:
          type: string
        requestId:
          type: string
        idempotencyKey:
          type: string
          description: Echoed for generation success and generation error responses.
        idempotencyStatus:
          $ref: '#/components/schemas/IdempotencyStatus'
        originalRequestAt:
          type: string
          format: date-time
          description: Always returned for successful idempotent replay responses and for idempotency conflict safe summaries.
        templateId:
          type: string
        routeType:
          $ref: '#/components/schemas/RouteType'
        resolvedReleaseVersion:
          type: string
        output:
          $ref: '#/components/schemas/OutputOptions'
        resolvedLegalEntityCode:
          type: string
          nullable: true
          description: >-
            Historical IBL-E4 echo. After ADR-0071 / Wave 6 runtime simplify: may be
            null/absent; must not imply live LegalEntity catalog resolve.
          maxLength: 64
        resolvedDocumentBrandCode:
          type: string
          nullable: true
          description: >-
            Historical IBL-E4 echo. After ADR-0071 / Wave 6: may be null/absent;
            artifact letterhead/logo/seal come from Letterhead (master), never from
            UI REDBC/GREENBC chrome codes or retired DocumentBrand catalogs.
          maxLength: 64
    DownloadUrlResponse:
      type: object
      additionalProperties: false
      required: [metadata, result]
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        result:
          type: object
          additionalProperties: false
          required: [download, documentId]
          properties:
            download:
              $ref: '#/components/schemas/DownloadInfo'
            documentId:
              type: string
            fidelityWarnings:
              type: array
              description: >-
                Full FidelityWarning objects for SYNC_DOWNLOAD_URL JSON success (empty when none).
                Never string[] codes. Distinct from SYNC_STREAM header-only summary.
              items:
                $ref: '#/components/schemas/FidelityWarning'
    DownloadInfo:
      type: object
      additionalProperties: false
      required: [url, expiresAt, requiresAuthorization, oneTime]
      properties:
        url:
          type: string
        expiresAt:
          type: string
          format: date-time
        requiresAuthorization:
          type: boolean
          const: true
        oneTime:
          type: boolean
          const: false
    AsyncAcceptedResponse:
      type: object
      additionalProperties: false
      required: [metadata, result]
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        result:
          type: object
          additionalProperties: false
          required: [task]
          properties:
            task:
              $ref: '#/components/schemas/TaskSummary'
    TaskResponse:
      type: object
      additionalProperties: false
      required: [metadata, result]
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        result:
          type: object
          additionalProperties: false
          required: [task]
          properties:
            task:
              $ref: '#/components/schemas/TaskSummary'
            download:
              $ref: '#/components/schemas/DownloadInfo'
            documentId:
              type: string
            fidelityWarnings:
              type: array
              description: >-
                Full FidelityWarning objects when a single-item JSON result layer is present
                (empty array when none). Batch completions use result.batch.items[].fidelityWarnings
                instead. Never string[] codes. SYNC_STREAM uses headers only.
              items:
                $ref: '#/components/schemas/FidelityWarning'
            batch:
              $ref: '#/components/schemas/BatchResult'
            error:
              $ref: '#/components/schemas/ErrorDetail'
    TaskCancelledResponse:
      type: object
      additionalProperties: false
      required: [metadata, result]
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        result:
          type: object
          additionalProperties: false
          required: [task]
          properties:
            task:
              $ref: '#/components/schemas/CancelledTaskSummary'
    InvocationKind:
      type: string
      enum: [SINGLE, BATCH_ROOT, BATCH_ITEM, ASYNC_TASK]
    InvocationStatus:
      type: string
      enum: [ACCEPTED, PROCESSING, SUCCEEDED, FAILED, PARTIAL_SUCCEEDED, EXPIRED, CANCELLED]
    InvocationSummary:
      type: object
      additionalProperties: false
      required: [invocationId, invocationKind, templateId, status, createdAt]
      properties:
        invocationId:
          type: string
          pattern: '^INV-[A-Za-z0-9]+$'
        invocationKind:
          $ref: '#/components/schemas/InvocationKind'
        templateId:
          type: string
          pattern: '^TPL-[A-Za-z0-9-]+$'
        resolvedReleaseVersion:
          type: string
        routeType:
          $ref: '#/components/schemas/RouteType'
        status:
          $ref: '#/components/schemas/InvocationStatus'
        requestId:
          type: string
        idempotencyKey:
          type: string
        batchId:
          type: string
        taskId:
          type: string
        parentInvocationId:
          type: string
        itemId:
          type: string
        artifactSaved:
          type: boolean
        documentId:
          type: string
        documentExpiresAt:
          type: string
          format: date-time
        recordExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        childItemCount:
          type: integer
          minimum: 0
          description: Present on BATCH_ROOT in logical view when child summaries are not embedded.
    InvocationListResponse:
      type: object
      additionalProperties: false
      required: [metadata, result]
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        result:
          type: object
          additionalProperties: false
          required: [view, items, page, size, totalElements]
          properties:
            view:
              type: string
              enum: [logical, flat]
            items:
              type: array
              items:
                $ref: '#/components/schemas/InvocationSummary'
            page:
              type: integer
              minimum: 0
            size:
              type: integer
              minimum: 1
            totalElements:
              type: integer
              minimum: 0
    InvocationDetailResponse:
      type: object
      additionalProperties: false
      required: [metadata, result]
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        result:
          type: object
          additionalProperties: false
          required: [invocation]
          properties:
            invocation:
              allOf:
                - $ref: '#/components/schemas/InvocationSummary'
                - type: object
                  additionalProperties: false
                  properties:
                    parameters:
                      type: object
                      additionalProperties: true
                      description: Sanitized request payload; encryption passwords excluded.
                    childItems:
                      type: array
                      items:
                        $ref: '#/components/schemas/InvocationSummary'
                      description: Optional embedded BATCH_ITEM summaries when view=logical on detail.
    CancelledTaskSummary:
      type: object
      additionalProperties: false
      required: [taskId, status, queryPath]
      properties:
        taskId:
          type: string
          pattern: '^TASK-[A-Za-z0-9]+$'
        status:
          type: string
          const: CANCELLED
        queryPath:
          type: string
        acceptedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    TaskSummary:
      type: object
      additionalProperties: false
      required: [taskId, status, queryPath]
      properties:
        taskId:
          type: string
          pattern: '^TASK-[A-Za-z0-9]+$'
        status:
          $ref: '#/components/schemas/TaskStatus'
        queryPath:
          type: string
        acceptedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    BatchResponse:
      type: object
      additionalProperties: false
      required: [metadata, result]
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        result:
          type: object
          additionalProperties: false
          required: [batch]
          properties:
            batch:
              $ref: '#/components/schemas/BatchResult'
    BatchResult:
      type: object
      additionalProperties: false
      required: [batchId, summary, items]
      properties:
        batchId:
          type: string
          pattern: '^BATCH-[A-Za-z0-9]+$'
        originalBatchId:
          type: string
          pattern: '^BATCH-[A-Za-z0-9]+$'
          description: >
            Present when the request supplied originalBatchId and lineage validation succeeded.
            Equals the request originalBatchId; never equal to this result's batchId.
        summary:
          type: object
          additionalProperties: false
          required: [totalCount, processedCount, successCount, failureCount, skippedCount]
          properties:
            totalCount:
              type: integer
              minimum: 0
            processedCount:
              type: integer
              minimum: 0
            successCount:
              type: integer
              minimum: 0
            failureCount:
              type: integer
              minimum: 0
            skippedCount:
              type: integer
              minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchResultItem'
    BatchResultItem:
      type: object
      additionalProperties: false
      required: [itemId, status, output, encryptionSummary]
      properties:
        itemId:
          type: string
        status:
          $ref: '#/components/schemas/BatchItemStatus'
        output:
          $ref: '#/components/schemas/OutputOptions'
        encryptionSummary:
          $ref: '#/components/schemas/EncryptionSummary'
        documentId:
          type: string
        download:
          $ref: '#/components/schemas/DownloadInfo'
        error:
          $ref: '#/components/schemas/ErrorDetail'
        fidelityWarnings:
          type: array
          description: >-
            Full FidelityWarning objects for this succeeded batch item (empty array when none).
            Never a string[] of codes. SYNC_STREAM file responses use header summaries instead
            (fidelityWarningCount / fidelityWarningCodes); see components.headers and contract-outline
            «保真警告响应确认».
          items:
            $ref: '#/components/schemas/FidelityWarning'
    AuditContextLinkage:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
        taskId:
          type: string
          pattern: '^TASK-[A-Za-z0-9]+$'
        batchId:
          type: string
          pattern: '^BATCH-[A-Za-z0-9]+$'
        itemId:
          type: string
    FidelityWarning:
      type: object
      additionalProperties: false
      description: >-
        Full fidelity warning object for JSON success paths (batch items, task query result layers,
        and DownloadUrlResponse when that mode is delivered). SYNC_STREAM responses do not embed this
        array in the body — they return only fidelityWarningCount / fidelityWarningCodes headers;
        complete non-sensitive detail enters the audit summary (CE-C03).
      required: [warningCode, messageKey, message, locationSummary, detectedSummary, recommendation, sensitiveDataExcluded]
      properties:
        warningCode:
          $ref: '#/components/schemas/FidelityWarningCode'
        messageKey:
          type: string
          description: >-
            Stable localization key. For CE-C06 DOCX_PERMISSIONS_NOT_APPLIED the
            key is generation.warning.fidelity.docxPermissionsNotApplied.
        message:
          type: string
        locationSummary:
          type: string
        detectedSummary:
          type: string
        recommendation:
          type: string
        sensitiveDataExcluded:
          type: boolean
          const: true
    EncryptionSummary:
      type: object
      additionalProperties: false
      required: [enabled, outputFormat, openPasswordProvided, ownerPasswordProvided, permissions]
      properties:
        enabled:
          type: boolean
        outputFormat:
          $ref: '#/components/schemas/OutputFormat'
        openPasswordProvided:
          type: boolean
        ownerPasswordProvided:
          type: boolean
        permissions:
          type: array
          description: >-
            Request-side permissions summary echo (not proof of file-level apply).
            For DOCX with non-empty requested permissions, callers must also read
            DOCX_PERMISSIONS_NOT_APPLIED on the success path.
          items:
            $ref: '#/components/schemas/Permission'
    ContractResponse:
      type: object
      additionalProperties: false
      required: [metadata, result]
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        result:
          type: object
          additionalProperties: false
          required: [templateId, paths, apiPolicy, callableVersions, schemas, errorCodes, examples]
          properties:
            templateId:
              type: string
            paths:
              type: array
              items:
                type: string
            defaultRoute:
              $ref: '#/components/schemas/DefaultRouteSummary'
            apiPolicy:
              $ref: '#/components/schemas/ApiPolicySummary'
            callableVersions:
              type: array
              description: >-
                Callable release versions. On this `/contract` response each item
                includes `variables[]` (per-field VariableSchema projection; may be
                empty). Match `defaultRoute.currentTargetReleaseVersion` to the same
                `releaseVersion` for the default-route field contract.
              items:
                $ref: '#/components/schemas/CallableVersion'
            schemas:
              type: array
              description: >-
                Envelope OpenAPI type-name index only (IBL-A4 / A4-C3). At least
                `GenerateRequest`, `BatchGenerateRequest`, `OutputOptions`, and
                `EncryptionOptions`. Not a substitute for per-field variable schemas;
                those live under `callableVersions[].variables`. Must not be cleared
                or replaced by field-level objects.
              items:
                type: string
              minItems: 1
            errorCodes:
              type: array
              items:
                $ref: '#/components/schemas/ErrorCodeSummary'
            examples:
              type: array
              items:
                type: string
    CallableVersionsResponse:
      type: object
      additionalProperties: false
      required: [metadata, result]
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        result:
          type: object
          additionalProperties: false
          required: [templateId, versions]
          properties:
            templateId:
              type: string
            versions:
              type: array
              items:
                $ref: '#/components/schemas/CallableVersion'
    CallableVersion:
      type: object
      additionalProperties: false
      required: [releaseVersion, explicitVersionUrl]
      properties:
        releaseVersion:
          type: string
        explicitVersionUrl:
          type: string
        deprecated:
          type: boolean
          description: >-
            Optional display-only deprecation flag for discovery UIs. Does not
            admit stopped or permanently deprecated release versions into the
            callable set; omit or false for currently callable PUBLISHED items.
        sunsetAt:
          type: string
          format: date-time
          description: >-
            Optional display-only sunset timestamp (ISO 8601 with timezone offset).
            Discovery metadata only; does not change callable candidate rules.
            Omit for currently callable PUBLISHED items when no sunset is published.
        variables:
          type: array
          description: >-
            Per-field variable schema for this `releaseVersion` (IBL-A4). Always
            present on `GET …/contract` (empty array when the version has zero
            VariableSchema rows). May be omitted on `GET …/versions`. Sorted by
            `variableKey` ascending. Does not include internal `id`, `defaultValue`,
            or `computeExpression` plaintext.
          items:
            $ref: '#/components/schemas/ContractVariableSchemaView'
    ContractVariableSchemaView:
      type: object
      additionalProperties: false
      description: >-
        Caller-visible per-field VariableSchema projection on `/contract`
        (IBL-A4). Behavior SoT: `docs/behavior/ibl-a4-contract-field-schemas.md`.
      required:
        - variableKey
        - variableType
        - required
        - computed
        - piiCategory
      properties:
        variableKey:
          type: string
          description: Stable variable key for generate `variables` map entries.
        variableType:
          $ref: '#/components/schemas/TemplateVariableType'
        required:
          type: boolean
          description: Whether a non-computed caller value is required at generate time.
        computed:
          type: boolean
          description: >-
            `true` when `variableType=COMPUTED` or the locked schema has a non-empty
            compute expression. Callers must not submit values for computed keys
            (aligned with IBL-A1). Expression plaintext is never returned.
        piiCategory:
          allOf:
            - $ref: '#/components/schemas/VariablePiiCategory'
          description: >-
            Always present on `/contract` projections (including `NONE`) so consumers
            need not infer classification. PII label changes alone are not treated as
            breaking by the consumer contract gate (IBL-A5 owns retention redaction).
        enumValues:
          type: array
          description: >-
            Present when `variableType=ENUM`: non-empty stable JSON string array of
            allowed values. Omitted for non-ENUM types.
          items:
            type: string
          minItems: 1
        description:
          type: string
          nullable: true
          description: Optional human-readable field description; may be null or omitted.
