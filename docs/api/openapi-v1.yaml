  /api/management/v1/library/export:
    post:
      tags: [Admin]
      operationId: exportLibraryTemplates
      summary: Export authorized eligible templates as a full-library ZIP (CE-E03)
      description: >-
        Assembles a `template-library-export-v1-zip` attachment for the caller's
        authorized export-eligible templates (lifecycle `PENDING_RELEASE` |
        `PUBLISHED` | `STOPPED` | `DEPRECATED`, same as single-template export).
        ZIP fixed relative paths: `library-export-manifest.json`;
        `templates/{templateId}.zip` (each byte-equivalent to E01
        `bundleVersion=2&format=zip`); deduped `masters/{masterFileHash}.docx`;
        deduped `clauses/{moduleCode}__{semanticVersion}.json`. Nested packs are
        always E01 v2; no library-embedded v1 mode. Default (no
        `dependencyClosure`): asset binaries are never embedded (keys only in
        manifest `assetKeyManifest`). When body `dependencyClosure=PROMOTION`
        (SYS-NORM Wave 7 / PP-C3), each nested `templates/{templateId}.zip` is a
        promotion pack (asset binaries + nesting closure as required), and the
        root may include deduped `assets/{assetKey}` binaries. Permission boundary
        reuses permission-matrix section 5 **导出模板** exactly — no new
        permission code: `GLOBAL_ADMIN` (all), `GROUP_ADMIN` (authorized groups),
        `DOCUMENT_AUTHOR` (own templates only); per-template authorization filter;
        `TEMPLATE_TESTER` and other non-export roles → 403. Optional body
        filters: `groupId`, `templateIds` (max 500), `includeSkipped` (default
        true), optional `dependencyClosure`. Candidate resolution: non-empty
        `templateIds` → those IDs ∩ auth ∩ existence; else non-empty `groupId` →
        group ∩ auth; else all authorized. Eligible candidate count max 500 →
        else 422 `api.error.library.exportLimitExceeded`. Empty INCLUDED set →
        422 `api.error.library.exportEmpty`. Partial success: HTTP 200 when
        `includedCount ≥ 1` (FAILED/SKIPPED recorded in manifest only).
        Unauthorized or unknown requested IDs are omitted from `templates[]`
        (`omittedUnauthorizedOrUnknownCount` only — no existence leak).
        Success (including partial) audits `LIBRARY_EXPORT` (batch id, counts,
        scope, actor; no clause full text, DOCX bytes, or variable values).
        No `Idempotency-Key` requirement (each call new `exportBatchId`).
        Library import and management batch-export UI remain out of scope.
        Traceability: BDD-CE-E03-001…016; docs/behavior/ce-e03-full-library-export.md;
        BDD-SYS-NORM-PP-006; docs/behavior/sys-norm-promotion-pack.md.
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryExportRequest'
      responses:
        '200':
          description: >-
            Full-library ZIP attachment (`template-library-export-v1-zip`).
            Not wrapped in the JSON success envelope.
          headers:
            Content-Disposition:
              description: Attachment disposition for the library export ZIP.
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
              description: >-
                ZIP with `library-export-manifest.json`, nested E01 v2
                `templates/{templateId}.zip`, and deduped `masters/` /
                `clauses/` catalogs. Default: no asset binary tree. With
                `dependencyClosure=PROMOTION`: nested promotion packs plus
                optional deduped root `assets/{assetKey}` binaries.
        '400':
          description: Invalid body (e.g. non-UUID fields).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          description: >-
            Caller lacks export-template permission (matrix §5); same fail-closed
            boundary as single-template export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: >-
            Empty exportable set (`api.error.library.exportEmpty`) or limit
            exceeded (`api.error.library.exportLimitExceeded`, `templateIds`
            length or eligible candidates > 500). No ZIP body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
