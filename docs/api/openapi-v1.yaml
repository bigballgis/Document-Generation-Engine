        - APPROVAL
        - PENDING_RELEASE
        - PUBLISHED
        - STOPPED
        - DEPRECATED
    TemplateVariableType:
      type: string
      enum: [TEXT, NUMBER, AMOUNT, DATE, ENUM, BOOLEAN, LIST, OBJECT, COMPUTED]
    VariablePiiCategory:
      type: string
      description: >
        Optional PII classification on a template variable schema field (CE-G03).
        `NONE` / omitted = not PII-governed for test-data-set save gates.
        Unknown values must be rejected (fail-closed). Management upsert/view and
        export/import bundle carry this field; runtime caller generate APIs are unchanged.
      enum:
        - NONE
        - PERSONAL_NAME
        - GOVERNMENT_ID
        - FINANCIAL_ACCOUNT
        - CONTACT
        - ADDRESS
        - OTHER_SENSITIVE
    TemplateImportConflictPolicy:
      type: string
      enum: [KEEP_TEMPLATE_ID, REJECT_IMPORT]
      description: >-
        Conflict resolution when bundle metadata `templateId` (internal UUID)
        already exists. Defaults to `REJECT_IMPORT` when omitted. Conflicting
        `externalId` always rejects import regardless of policy.
    TemplateExportMetadataView:
      type: object
      additionalProperties: false
      required:
        - templateId
        - externalId
