        drill-down works on authoring and published release Testing surfaces.
        Authorization reuses `requireReadableSnapshot` (fail-closed 403/404).
        Alternative allowed by BDD CE-U18: expose the same `sampleResults` on
        `GET .../batch-tests/{runId}` detail instead of (or in addition to)
        embedding on this list — implement exactly one primary FE-consumable
        surface and lock with tests. Sync `POST .../previews/batch-test` remains
        out of the management UI journey (may stay for demo/seed service calls).
