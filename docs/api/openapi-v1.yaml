            head has no lifecycle axis yet (e.g. DRAFT/SUBMITTED). Badge UI
            prefers DEPRECATED/STOPPED over reviewState when present.
          enum: [ACTIVE, STOPPED, DEPRECATED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        locale:
          type: string
          maxLength: 64
          description: IBL-E1 / ADR-0062 — package body locale (BCP-47).
        localeVariantFamilyId:
          type: string
          format: uuid
          nullable: true
          description: IBL-E1 / ADR-0062 — optional locale-variant family id.
