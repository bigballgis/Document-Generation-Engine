    BatchTestHistorySampleResultView:
      type: object
      additionalProperties: true
      description: >-
        Per-sample result for management batch-test history drill-down (CE-U18;
        PTA persist alignment / BDD-PTA-004). Canonical async shape (persisted
        into `sampleResultsJson` by AsyncBatchTestOrchestrator /
        AsyncBatchTestExecutionSupport): `dataSetExternalId`, `success`,
        optional `errorDetail`, and — when the sample produced a preview —
        non-null `previewId` plus `docxKey` / `pdfKey` when those artifacts
        were stored (mapped from PreviewRecordView storage keys). Failed
        samples may omit preview/artifact keys. Historical rows may still
        contain legacy sync-shaped objects (`testDataSetId`, `status`, …) and
        pre-PTA async rows that dropped `previewId` (null keys). Frontend MUST
        normalize either shape to one display model; API MUST NOT require FE
        to read DB. Schema fields stay optional for legacy/partial rows; the
        persist rule above is the confirmed write contract for new async runs.
      properties:
        dataSetExternalId:
          type: string
          description: Canonical async dataset external id.
        success:
          type: boolean
          description: Canonical async success flag.
        errorDetail:
          type: string
          nullable: true
          description: Failure detail when success is false.
        docxKey:
          type: string
          nullable: true
          description: >-
            Object-storage key for the sample DOCX artifact when produced.
            Confirmed on new async success samples that stored DOCX; null-ok
            on failure, missing artifact, or pre-PTA persisted rows.
        pdfKey:
          type: string
          nullable: true
          description: >-
            Object-storage key for the sample PDF artifact when produced.
            Confirmed on new async success samples that stored PDF; null-ok
            on failure, missing artifact, or pre-PTA persisted rows.
        testDataSetId:
          type: string
          nullable: true
          description: Legacy sync-shaped dataset id (normalize on FE).
        previewId:
          type: string
          nullable: true
          description: >-
            Preview run id for Open preview drill-down. Canonical on new async
            success samples that produced a preview (PTA / BDD-PTA-004); also
            present on legacy sync-shaped historical rows. Null-ok on failure
            samples and pre-PTA async rows that dropped the field.
        status:
          type: string
          nullable: true
          description: Legacy sync-shaped preview/status enum string.
