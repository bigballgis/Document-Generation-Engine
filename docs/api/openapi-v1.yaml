        when omitted, sets `nextReviewDue` to completion-day UTC date + 365 days.
        Requires group-scoped template access **and** `authorTemplates` (same
        author-workflow boundary as CE-U07); others → 403. Soft-deleted /
        invisible templates → 404 (or non-leaking 403 per existing template API
        convention). Writes management audit
        `TEMPLATE_ANNUAL_REVIEW_COMPLETED` (templateId/externalId,
        previousNextReviewDue, newNextReviewDue, actorUsername; **no** variables /
        credentials / clause body). Does **not** block publish or runtime
