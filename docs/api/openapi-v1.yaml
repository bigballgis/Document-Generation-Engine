        errorCode:
          type: string
          enum:
            [JOURNEY_REQUEST_REQUIRED, TEMPLATE_ID_REQUIRED, JOURNEY_REQUEST_INVALID, JOURNEY_ROLE_DENIED, JOURNEY_STATE_TRANSITION_DENIED, EXPORT_GOVERNANCE_DECISION_REQUIRED, TIMEOUT_EVALUATION_REQUEST_INVALID]
        errorMessage:
          type: string
        snapshot:
          type: object
          additionalProperties: false
          properties:
            templateId:
              type: string
            state:
              type: string
              enum: [DRAFT, TEST_SUBMITTED, TEST_PASSED, APPROVAL_SUBMITTED, APPROVED, PENDING_RELEASE, PUBLISHED, STOPPED, DEPRECATED]
            updatedAt:
              type: string
              format: date-time
            updatedBy:
              type: string
        exportDecision:
          type: object
          additionalProperties: false
          properties:
            templateId:
              type: string
            decidedBy:
              type: string
            decidedAt:
              type: string
              format: date-time
            fallbackDecisionRecorded:
              type: boolean
            decisionSource:
              type: string
        timeoutEvaluation:
          type: object
          additionalProperties: false
          properties:
            stage:
              type: string
              enum: [TEST, APPROVAL, PENDING_RELEASE, REMEDIATION]
            timeoutThresholdHours:
              type: integer
            elapsedHours:
              type: integer
            escalated:
              type: boolean
            severity:
              type: string
              enum: [NONE, WARNING, CRITICAL]
      required: [applied]
    ContentModuleLifecycleOperationType:
      type: string
      enum: [STOP_USE, RECOVER, DEPRECATE]
    ContentModuleLifecycleOperationApplyRequest:
      type: object
      additionalProperties: false
      required: [operationType, actorRole, actorId, impactSummaryViewed, secondConfirmation]
      properties:
        operationType:
          $ref: '#/components/schemas/ContentModuleLifecycleOperationType'
        actorRole:
          $ref: '#/components/schemas/LifecycleGovernanceActorRole'
        actorId:
          type: string
          minLength: 1
        impactSummaryViewed:
          description: Must be true for all lifecycle operations.
          type: boolean
        secondConfirmation:
          description: Must be true for all lifecycle operations.
          type: boolean
        impactSummary:
          description: Required for STOP_USE and DEPRECATE operations.
          $ref: '#/components/schemas/ContentModuleLifecycleImpactSummary'
    ContentModuleLifecycleImpactSummary:
      type: object
      additionalProperties: false
      required:
        - referenceTemplateCount
        - referenceTemplateListHint
        - impactedReleaseVersionsHint
        - defaultRouteAffected
        - recentCallSummary
        - remediationHint
        - templateStopRequired
        - releaseStopRequired
      properties:
        referenceTemplateCount:
          type: integer
          minimum: 0
        referenceTemplateListHint:
          type: string
          minLength: 1
        impactedReleaseVersionsHint:
          type: string
          minLength: 1
        defaultRouteAffected:
          type: boolean
        recentCallSummary:
          type: string
          minLength: 1
        remediationHint:
          type: string
          minLength: 1
        templateStopRequired:
          type: boolean
          description: >
            True when referenced published templates exist and a blocking condition applies
            (recent runtime generation calls within 7 days or default-route impact). Signals
            that administrators should stop affected templates to immediately block generation.
        releaseStopRequired:
          type: boolean
          description: >
            True when referenced release versions exist and a blocking condition applies
            (recent runtime generation calls within 7 days or default-route impact). Signals
            that administrators should stop affected release versions to immediately block
            generation.
    ContentModuleLifecycleSnapshot:
      type: object
      additionalProperties: false
      required: [moduleId, state, updatedAt, updatedBy]
      properties:
        moduleId:
          type: string
        state:
          $ref: '#/components/schemas/LifecycleState'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
    ContentModuleLifecycleOperationResult:
      type: object
      additionalProperties: false
      required: [applied]
      properties:
        applied:
          type: boolean
        errorCode:
          type: string
          enum:
            - CONTENT_MODULE_REQUEST_INVALID
            - CONTENT_MODULE_REQUEST_REQUIRED
            - MODULE_ID_REQUIRED
            - ACTOR_ID_REQUIRED
            - CONTENT_MODULE_IMPACT_CONFIRMATION_REQUIRED
            - CONTENT_MODULE_ROLE_DENIED
            - CONTENT_MODULE_STATE_TRANSITION_DENIED
            - CONTENT_MODULE_OPERATION_UNSUPPORTED
        errorMessage:
          type: string
        snapshot:
          $ref: '#/components/schemas/ContentModuleLifecycleSnapshot'
        impactSummary:
          $ref: '#/components/schemas/ContentModuleLifecycleImpactSummary'
    ErrorCodeSummary:
      type: object
      additionalProperties: false
      required: [category, code, messageKey, retryable, message]
      properties:
        category:
          $ref: '#/components/schemas/ErrorCategory'
        code:
          $ref: '#/components/schemas/ErrorCode'
        messageKey:
          type: string
        retryable:
          type: boolean
