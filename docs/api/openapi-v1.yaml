      type: object
      additionalProperties: false
      properties:
        outputFormat:
          type: string
          enum: [DOCX, PDF]
          description: >-
            Optional. Defaults to the source invocation output_format; when that
            is null/empty, defaults to PDF.
        productionReissue:
          type: boolean
          description: >-
            Optional. Default false / absent = CE-G06 audit specimen path
            (SPECIMEN forced). When true, requests PD-6 production re-issue
            (no SPECIMEN); requires non-blank reason; roles narrowed to
            GLOBAL_ADMIN / in-scope GROUP_ADMIN (AUDIT_ADMIN forbidden).
        reason:
          type: string
          maxLength: 500
          description: >-
            Required when productionReissue=true (trim after; blank → 400
            PRODUCTION_REISSUE_REASON_REQUIRED). Ignored / optional for default
            specimen regenerate. Persisted for audit accountability; never
            contains variables.
    ManagementInvocationRegenerateView:
      type: object
      additionalProperties: false
      required:
        - regenerationId
        - sourceInvocationId
        - releaseBundleSnapshotId
        - releaseBundleHash
        - outputFormat
        - specimen
        - encryptionReapplied
      properties:
        regenerationId:
          type: string
          format: uuid
        sourceInvocationId:
          type: string
        releaseBundleSnapshotId:
          type: string
          format: uuid
        releaseBundleHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        outputFormat:
          type: string
          enum: [DOCX, PDF]
        specimen:
          type: boolean
          description: >-
            true for default CE-G06 SPECIMEN regenerate; false for PD-6
            production re-issue (productionReissue=true success path).
        encryptionReapplied:
          type: boolean
          description: >-
            Always false — original encryption passwords are not retained;
            regenerate artifacts are unencrypted (specimen or production
            re-issue).
        downloadUrl:
          type: string
          nullable: true
          description: Short-lived download URL when issued; may be omitted in favor of artifactPath.
        artifactPath:
          type: string
          nullable: true
          description: >-
            Management artifact reference under regenerations/{regenerationId}/…
            (preferred when downloadUrl is not issued).
