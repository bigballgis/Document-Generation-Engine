  /api/management/v1/templates/{templateId}/api/invocations/{invocationId}/regenerate:
    post:
      tags: [Admin]
      operationId: regenerateTemplateManagementInvocation
      summary: Controlled regenerate by invocation (CE-G06 SPECIMEN; PD-6 opt-in production re-issue)
      description: >-
        Permissioned regenerate for a SINGLE / BATCH_ITEM / ASYNC_TASK
        invocation that has non-null release-bundle fingerprint fields and is
        within retention. Replays stored parameters against the K01-pinned
        master, writes management audit INVOCATION_REGENERATED, and never
        returns variables or encryption passwords. Does not create a
        caller-facing runtime SUCCESS invocation or consume caller idempotency
        keys. No idempotencyKey required.

        Default mode (productionReissue absent or false): CE-G06 audit specimen
        — applies CE-G02 SPECIMEN watermark; specimen=true. Authorized roles:
        GLOBAL_ADMIN, in-scope GROUP_ADMIN, in-scope AUDIT_ADMIN (readAudit +
        template visibility).

        Production re-issue mode (PD-6): productionReissue=true AND non-blank
        reason (trim; max 500). Skips SPECIMEN stampers; specimen=false.
        Authorized roles narrowed to GLOBAL_ADMIN and in-scope GROUP_ADMIN only;
        AUDIT_ADMIN → 403. Missing/blank reason → 400
        PRODUCTION_REISSUE_REASON_REQUIRED. Preview/test-generate must not
        accept productionReissue. FE regenerate CTA remains out of scope.
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invocationId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagementInvocationRegenerateRequest'
      responses:
        '200':
          description: >-
            Regeneration accepted and artifact available (specimen=true for
            default CE-G06 path; specimen=false for PD-6 production re-issue).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementInvocationRegenerateResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
