          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    BulkRepinContentModuleReferencesRequest:
      type: object
      additionalProperties: false
      description: >-
        IBL-E5 / ADR-0066 bulk re-pin request. Exactly one of `toSemanticVersion`
        or `useLatestApproved=true` must select the target. Omitting `dryRun` is
        a validation failure (400/422).
      required: [contentModuleId, dryRun]
      properties:
        groupCode:
          type: string
          description: >-
            Optional when the authorized group context is unambiguous from the
            session; required when the caller must disambiguate among multiple
            authorized groups.
        contentModuleId:
          type: string
          format: uuid
        fromSemanticVersion:
          type: string
          description: Optional filter — only pins currently at this semantic version.
        toSemanticVersion:
          type: string
          description: Target pin semantic version. Mutually exclusive with useLatestApproved=true.
        useLatestApproved:
          type: boolean
          description: >-
            When true, retarget to the latest referencable APPROVED+ACTIVE version
            of contentModuleId. Mutually exclusive with toSemanticVersion.
        templateIds:
          type: array
          items:
            type: string
            format: uuid
          description: Optional narrow set within the caller's authorTemplates visibility.
        dryRun:
          type: boolean
          description: Required. true = preview only (zero pin persistence); false = apply.
    BulkRepinItemStatus:
      type: string
      description: Per-template-version outcome for bulk re-pin (IBL-E5).
      enum:
        - WOULD_APPLY
        - APPLIED
        - SKIPPED_LOCKED
        - SKIPPED_ALREADY_AT_TARGET
        - SKIPPED_NO_MATCH
        - FAILED
    BulkRepinItemView:
      type: object
      additionalProperties: false
      required: [templateId, status]
      properties:
        templateId:
          type: string
          format: uuid
        templateVersionId:
          type: string
          format: uuid
        referenceKey:
          type: string
        beforeSemanticVersion:
          type: string
          nullable: true
        afterSemanticVersion:
          type: string
          nullable: true
          description: Preview/apply target pin; null when skipped with no target resolution.
        status:
          $ref: '#/components/schemas/BulkRepinItemStatus'
        errorCode:
          type: string
          nullable: true
          description: >-
            Present when status=FAILED. Stable codes include BULK_REPIN_TARGET_INVALID.
    BulkRepinSummaryView:
      type: object
      additionalProperties: false
      required:
        - dryRun
        - wouldApplyCount
        - appliedCount
        - skippedLockedCount
        - skippedAlreadyAtTargetCount
        - skippedNoMatchCount
        - failedCount
      properties:
        dryRun:
          type: boolean
        wouldApplyCount:
          type: integer
          minimum: 0
        appliedCount:
          type: integer
          minimum: 0
        skippedLockedCount:
          type: integer
          minimum: 0
        skippedAlreadyAtTargetCount:
          type: integer
          minimum: 0
        skippedNoMatchCount:
          type: integer
          minimum: 0
        failedCount:
          type: integer
          minimum: 0
