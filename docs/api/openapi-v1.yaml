          nullable: true
        invalidatedAt:
          type: string
          format: date-time
          nullable: true
        sampleResults:
          type: array
          nullable: true
          description: >-
            CE-U18 / PTA: per-sample results derived from persisted
            `sampleResultsJson`. For COMPLETED async runs after PTA persist
            fix, successful samples that produced a preview expose
            `previewId` (and `docxKey` / `pdfKey` when stored) for Open
            preview. Null or empty when not yet available (e.g. RUNNING) or
