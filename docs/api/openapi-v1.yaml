  /api/management/v1/content-modules:
    get:
      tags: [Admin]
      operationId: listContentModules
      summary: List content modules (server-side PageView)
      description: >-
        Lists non-deleted content modules as a standard `PageView` (LR-C5 /
        BDD-LRP-C5-CATALOG-001; CE-U20 / BDD-CE-U20-CCS; CE-G05 /
        BDD-CE-G05-011…016). When `groupCode` is omitted, returns modules
        accessible to the caller across authorized groups (including shared
        modules). When `groupCode` is provided, exact-match filter intersected
        with session authorization (unauthorized group → empty page). Optional
        `search` behavior depends on `searchMode` (default `NAME`): `NAME` =
        case-insensitive contains over `name` ∪ `moduleCode` ∪ `groupCode`
        (LR-C5; does not scan body); `FULL_TEXT` = PostgreSQL tsvector match on
        the catalog-filter version `content_structure_json` searchable text
        (CE-K08 version selection: latest APPROVED+ACTIVE, else latest;
        config `simple`). Empty/blank `search` ignored in both modes. Optional
        `status` filters by the module **head version** display status (CE-U20;
        AND with search / groupCode / sort / CE-K08 legal filters). Default sort
        is group-first (`groupCodeAsc`) for `NAME`; for `FULL_TEXT` with a
        non-empty search, default ranking is `ts_rank` DESC then `updatedAt`
        DESC (G05-D4). Pagination unit is **rows** (not group count). Each
        summary row projects head `reviewState` (required) and `lifecycleState`
        (optional). `contentStructureJson` visibility unchanged (§5.1). Requires
        catalog browse access per permission matrix §5.1 (`TEMPLATE_TESTER` →
        403). Breaking change vs pre-LR-C5 bare array: management UI upgrades in
        the same slice; no external runtime callers.
      parameters:
        - $ref: '#/components/parameters/CatalogPageQuery'
        - $ref: '#/components/parameters/CatalogSizeQuery'
        - $ref: '#/components/parameters/CatalogSearchQuery'
        - name: searchMode
          in: query
          required: false
          description: >-
            CE-G05 — how `search` is applied. `NAME` (default) keeps LR-C5 ILIKE
            on name/moduleCode/groupCode. `FULL_TEXT` matches the catalog-filter
            version body tsvector (`@@` plainto_tsquery/websearch; config
            `simple`). AND with `status` / `groupCode` / CE-K08 legal filters.
            Search strings longer than 200 characters → 422 VALIDATION.
            Unknown values → 422 VALIDATION.
          schema:
            type: string
            enum: [NAME, FULL_TEXT]
            default: NAME
        - $ref: '#/components/parameters/CatalogGroupCodeQuery'
        - name: sort
          in: query
          required: false
          description: >-
            Whitelist sort key. Default `groupCodeAsc` for `NAME` mode.
            Unknown values fall back to `groupCodeAsc` (no 400). Content-modules
            also support `moduleCodeAsc`. When `searchMode=FULL_TEXT` and
            `search` is non-empty, ranking defaults to ts_rank DESC then
            `updatedAt` DESC unless an explicit whitelist sort is supplied.
          schema:
            type: string
            enum: [groupCodeAsc, updatedAtDesc, updatedAtAsc, nameAsc, moduleCodeAsc]
            default: groupCodeAsc
        - name: status
          in: query
          required: false
          description: >-
            CE-U20 — optional exact match on the catalog **head version** display
            status (badge-aligned). Head version = max `updatedAt` among the
            module's versions; ties broken by lexicographically greater
            `semanticVersion`. Match rules: if head `lifecycleState` is
            `DEPRECATED` or `STOPPED`, only those values match; otherwise match
            `reviewState` (`APPROVED` matches when lifecycle is `ACTIVE` or
            null/absent). Unknown/illegal values → successful empty page
            (not 400). AND with `search` / `groupCode` / sort / CE-K08 legal
            filters. Distinct from CE-K08 catalog-filter-version selection
            (latest APPROVED+ACTIVE, else latest).
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, APPROVED, STOPPED, DEPRECATED]
        - name: jurisdiction
          in: query
          required: false
          description: >-
            CE-K08 — case-insensitive exact match on the catalog filter version
            jurisdiction (trim). Catalog filter version = latest APPROVED+ACTIVE,
            else latest version.
          schema:
            type: string
            maxLength: 128
        - name: legalReviewRef
          in: query
          required: false
          description: >-
            CE-K08 — case-insensitive exact match on the catalog filter version
            legalReviewRef (trim).
          schema:
            type: string
            maxLength: 128
        - name: effectiveFrom
          in: query
          required: false
          description: >-
            CE-K08 — keep modules whose catalog filter version effectiveFrom is
            >= this Instant. Versions with null effectiveFrom do not match.
          schema:
            type: string
            format: date-time
        - name: effectiveTo
          in: query
          required: false
          description: >-
            CE-K08 — keep modules whose catalog filter version effectiveTo is
            <= this Instant. Versions with null effectiveTo do not match.
          schema:
            type: string
            format: date-time
        - name: locale
          in: query
          required: false
          description: >-
            IBL-E1 / ADR-0062 — optional exact match on content-module package
            body `locale` (BCP-47). AND with search / searchMode / status /
            groupCode / sort / CE-K08 legal filters. Unknown or non-matching
            values → successful empty page (not 400).
          schema:
            type: string
            maxLength: 64
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Paginated content module summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentModuleSummaryPageResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
