    ComputeExpressionValidateRequest:
      type: object
      additionalProperties: false
      required: [expression, knownVariableKeys]
      description: >-
        CE-K03 author-time compute expression validation payload
        (`POST …/compute-expressions/validate`).
        IBL-A2: `FORMAT_AMOUNT(value)` or `FORMAT_AMOUNT(value, currencyCode)`
        (ISO 4217); see docs/behavior/ibl-a2-format-amount-currency.md.
        IBL-A3: `SPELL_AMOUNT(value)` (CNY Chinese always) or
        `SPELL_AMOUNT(value, currencyCode)` (ISO + locale language); see
        docs/behavior/ibl-a3-amount-in-words.md.
      properties:
        variableKey:
          type: string
          description: Optional variable key being authored (for error context).
          maxLength: 128
        expression:
          type: string
          description: >-
            Whitelist compute DSL expression to validate.
            `FORMAT_AMOUNT(value)` (locale-default currency) or
            `FORMAT_AMOUNT(value, currencyCode)` with ISO 4217 alphabetic code
            (IBL-A2); second arg is not a locale tag.
            `SPELL_AMOUNT(value)` (CNY Chinese, locale-independent) or
            `SPELL_AMOUNT(value, currencyCode)` (ISO 4217 + locale language;
            IBL-A3); supported pairs at least `(en,USD)` and `(zh,CNY)`.
          minLength: 1
          maxLength: 2048
        knownVariableKeys:
          type: array
          description: Variable keys available for `${path}` reference checks.
          items:
            type: string
            minLength: 1
            maxLength: 128
    ComputeExpressionValidateView:
      type: object
      additionalProperties: false
      required: [valid]
      description: CE-K03 compute expression validation result body.
      properties:
        valid:
          type: boolean
        message:
          type: string
          nullable: true
          description: Non-sensitive validation failure reason when `valid` is false.
    ComputeExpressionValidateResponse:
      type: object
      additionalProperties: false
      required: [metadata, result]
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        result:
          $ref: '#/components/schemas/ComputeExpressionValidateView'
    ComputeExpressionEvaluateRequest:
      type: object
      additionalProperties: false
      required: [expression, sampleVariables]
      description: >-
        CE-K03 author-time sample evaluation payload
        (`POST …/compute-expressions/evaluate`).
        IBL-A2: binary `FORMAT_AMOUNT` optional ISO 4217 currency; invalid/blank
        currency → `VARIABLE_COMPUTE_FAILED`. Behavior:
        docs/behavior/ibl-a2-format-amount-currency.md.
        IBL-A3: unary `SPELL_AMOUNT` = CNY Chinese always; binary
        `SPELL_AMOUNT` = ISO + locale language; unsupported pair / illegal
        currency / bad arity → `VARIABLE_COMPUTE_FAILED`. Behavior:
        docs/behavior/ibl-a3-amount-in-words.md.
      properties:
        variableKey:
          type: string
          description: Optional variable key being previewed (for error context).
          maxLength: 128
        expression:
          type: string
          description: >-
            Whitelist compute DSL expression to evaluate.
            Examples: `FORMAT_AMOUNT(${principal})` (locale-default currency);
            `FORMAT_AMOUNT(${principal}, 'EUR')` (ISO 4217 + locale formatting);
            `SPELL_AMOUNT(${principal})` (CNY Chinese always);
            `SPELL_AMOUNT(${principal}, 'USD')` with locale `en-US` (en+USD
            amount-in-words). Invalid/blank currency, unsupported SPELL pair,
            or bad arity on binary forms → `VARIABLE_COMPUTE_FAILED`.
          minLength: 1
          maxLength: 2048
        sampleVariables:
          type: object
          additionalProperties: true
          description: >-
            Sample variable map for preview evaluation. Must not include
            secrets; values are author-supplied fixtures only.
        locale:
          type: string
          description: >-
            Optional BCP-47 locale tag (default zh-CN for FORMAT_* / SPELL_AMOUNT).
            Controls number/grouping localization for `FORMAT_AMOUNT`; currency
            identity on binary `FORMAT_AMOUNT` comes from the ISO 4217 argument,
            not from this field (IBL-A2). For binary `SPELL_AMOUNT`, primary
            language of this locale selects the speller with the ISO currency
            (IBL-A3); unary `SPELL_AMOUNT` ignores locale language (always CNY
            Chinese). Default `zh-CN` means binary USD requires an explicit
            `en` / `en-US` locale.
          maxLength: 32
    ComputeExpressionEvaluateView:
      type: object
      additionalProperties: false
      required: [success, result]
      description: CE-K03 sample compute evaluation result body.
      properties:
        success:
          type: boolean
        result:
          description: Evaluated value (number, string, boolean, or structured).
          nullable: true
        variableKey:
          type: string
          nullable: true
        expressionSummary:
          type: string
