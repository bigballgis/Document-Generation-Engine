openapi: 3.1.0
info:
  title: Document Generation Dynamic API
  version: 1.0.0
  summary: Enterprise financial letter document generation API contract
  description: >-
    Formal v1 OpenAPI contract for template-based document generation. Template
    variables are constrained by each released template version contract.
servers:
  - url: /
    description: Deployment root. Paths include /api/{environment}/v1.
tags:
  - name: Contract
    description: Contract discovery and callable version visibility.
  - name: Generation
    description: Single and batch document generation.
  - name: Task
    description: Async task query and cancellation.
  - name: Download
    description: Generated document download.
  - name: Invocation
    description: Caller-scoped invocation record query and parameter backup.
  - name: Admin
    description: API management, credential lifecycle administration, template lifecycle governance, template/master/content-module catalog list pagination (LR-C5 PageView), Dashboard Overview summary aggregates (PRR-D01c), template export/import, full-library export (CE-E03), master revision-line read paths, content-module governance, collaboration timeout configuration, and platform asset-library catalog (CE-E02 upload/list/disable).
  - name: Collaboration
    description: Collaboration work-item queues and timeout threshold administration.
security:
  - ApiCredentialId: []
    ApiCredentialSecret: []
    AccessAccount: []
paths:
  /api/{environment}/v1/templates/{templateId}/contract:
    get:
      tags: [Contract]
      operationId: getTemplateApiContract
      summary: Get template API contract summary
      description: >-
        Returns the current authorized contract summary, policy summary, callable
        versions (each with per-field `variables[]` projected from the release-locked
        VariableSchema — IBL-A4), envelope schema type-name index (`schemas: string[]`),
        error code summary, and example index. Management
        `GET /api/management/v1/templates/{templateId}/api/contract` uses the same
        assembly for `callableVersions[].variables`. The response does not embed this
        full OpenAPI YAML file. See `docs/behavior/ibl-a4-contract-field-schemas.md`
        (BDD-IBL-A4-001 through BDD-IBL-A4-011).
      parameters:
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Contract summary returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        '504':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/{environment}/v1/templates/{templateId}/versions:
    get:
      tags: [Contract]
      operationId: listCallableVersions
      summary: List callable release versions
      description: >-
        Returns release versions currently callable from the caller's authorization
        view. This is not a back-office version management list. Optional per-item
        `deprecated` and `sunsetAt` fields are display/discovery metadata only and
        must not change the callable candidate set (see ADR-0003 / ADR-0017 display
        boundary). Per-field `variables[]` is authoritative on
        `GET .../contract` (IBL-A4); this list endpoint may omit `variables` to keep
        payloads light.
      parameters:
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Callable release versions returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallableVersionsResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        '504':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/{environment}/v1/templates/{templateId}/versions/{releaseVersion}/generate:
    post:
      tags: [Generation]
      operationId: generateDocumentByVersion
      summary: Generate a document by explicit release version
      description: >-
        IBL-A1: Before compute/assemble, `variables` are fail-closed validated
        against the target release VariableSchema (required / type / enum;
        unknown keys rejected). Failures return HTTP 422 with
        `error.code=VARIABLE_VALIDATION_FAILED`, `category=VALIDATION`,
        `retryable=false`, and non-empty `fieldErrors[]`
        (`reason` ∈ REQUIRED | INVALID_TYPE | INVALID_FORMAT | ENUM_NOT_ALLOWED |
        UNKNOWN_FIELD). No successful DOCX/PDF on failure.
        Behavior: docs/behavior/ibl-a1-variable-validation.md.
      parameters:
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/ReleaseVersion'
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: Synchronous generation completed.
          headers:
            auditId:
              $ref: '#/components/headers/AuditId'
            traceId:
              $ref: '#/components/headers/TraceId'
            requestId:
              $ref: '#/components/headers/RequestId'
            idempotencyKey:
              $ref: '#/components/headers/IdempotencyKey'
            idempotencyStatus:
              $ref: '#/components/headers/IdempotencyStatus'
            documentId:
              $ref: '#/components/headers/DocumentId'
            templateId:
              $ref: '#/components/headers/TemplateId'
            routeType:
              $ref: '#/components/headers/RouteType'
            resolvedReleaseVersion:
              $ref: '#/components/headers/ResolvedReleaseVersion'
            output.format:
              $ref: '#/components/headers/OutputFormat'
            output.mode:
              $ref: '#/components/headers/OutputMode'
            fidelityWarningCount:
              $ref: '#/components/headers/FidelityWarningCount'
            fidelityWarningCodes:
              $ref: '#/components/headers/FidelityWarningCodes'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadUrlResponse'
        '202':
          $ref: '#/components/responses/AsyncAccepted'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        '504':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/{environment}/v1/templates/{templateId}/default/generate:
    post:
      tags: [Generation]
      operationId: generateDocumentByDefaultRoute
      summary: Generate a document through the default route
      description: >-
        IBL-A1: Same fail-closed VariableSchema validation as explicit-version
        generate. Failures → 422 `VARIABLE_VALIDATION_FAILED` + `fieldErrors[]`.
        Behavior: docs/behavior/ibl-a1-variable-validation.md.
      parameters:
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: Synchronous generation completed.
          headers:
            auditId:
              $ref: '#/components/headers/AuditId'
            traceId:
              $ref: '#/components/headers/TraceId'
            requestId:
              $ref: '#/components/headers/RequestId'
            idempotencyKey:
              $ref: '#/components/headers/IdempotencyKey'
            idempotencyStatus:
              $ref: '#/components/headers/IdempotencyStatus'
            documentId:
              $ref: '#/components/headers/DocumentId'
            templateId:
              $ref: '#/components/headers/TemplateId'
            routeType:
              $ref: '#/components/headers/RouteType'
            resolvedReleaseVersion:
              $ref: '#/components/headers/ResolvedReleaseVersion'
            output.format:
              $ref: '#/components/headers/OutputFormat'
            output.mode:
              $ref: '#/components/headers/OutputMode'
            fidelityWarningCount:
              $ref: '#/components/headers/FidelityWarningCount'
            fidelityWarningCodes:
              $ref: '#/components/headers/FidelityWarningCodes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadUrlResponse'
            application/octet-stream:
              schema:
                type: string
                format: binary
        '202':
          $ref: '#/components/responses/AsyncAccepted'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        '504':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/{environment}/v1/templates/{templateId}/versions/{releaseVersion}/batch-generate:
    post:
      tags: [Generation]
      operationId: batchGenerateByVersion
      summary: Batch generate documents by explicit release version
      description: >-
        IBL-A1: Each item's `variables` are fail-closed validated against the
        target release VariableSchema before assemble. A failing item must not
        be `SUCCEEDED` and must not write a successful artifact; item error
        semantics use `VARIABLE_VALIDATION_FAILED` + field list (same shape as
        sync generate). Behavior: docs/behavior/ibl-a1-variable-validation.md.
      parameters:
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/ReleaseVersion'
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGenerateRequest'
      responses:
        '200':
          description: Synchronous batch result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '202':
          $ref: '#/components/responses/AsyncAccepted'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        '504':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/{environment}/v1/templates/{templateId}/default/batch-generate:
    post:
      tags: [Generation]
      operationId: batchGenerateByDefaultRoute
      summary: Batch generate documents through the default route
      description: >-
        IBL-A1: Same per-item fail-closed VariableSchema validation as
        explicit-version batch-generate. Item failures →
        `VARIABLE_VALIDATION_FAILED` + field list.
        Behavior: docs/behavior/ibl-a1-variable-validation.md.
      parameters:
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGenerateRequest'
      responses:
        '200':
          description: Synchronous batch result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '202':
          $ref: '#/components/responses/AsyncAccepted'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        '504':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/{environment}/v1/templates/{templateId}/tasks/{taskId}:
    get:
      tags: [Task]
      operationId: getAsyncTask
      summary: Query async task status and result
      parameters:
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/TaskQueryRequestId'
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Async task state returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        '504':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/{environment}/v1/templates/{templateId}/tasks/{taskId}/cancel:
    post:
      tags: [Task]
      operationId: cancelAsyncTask
      summary: Cancel an active async task
      parameters:
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Task cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCancelledResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        '504':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/{environment}/v1/templates/{templateId}/invocations:
    get:
      tags: [Invocation]
      operationId: listInvocationRecords
      summary: List caller-scoped invocation records for a template
      description: >-
        Returns invocation history for the authenticated API credential only.
        Use view=logical (default) for batch roots and async tasks, or view=flat
        for per-item rows without BATCH_ROOT. Optional requestId filter for tracing.
      parameters:
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/InvocationViewQuery'
        - $ref: '#/components/parameters/InvocationRequestIdQuery'
        - $ref: '#/components/parameters/InvocationPageQuery'
        - $ref: '#/components/parameters/InvocationSizeQuery'
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Invocation list returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/{environment}/v1/templates/{templateId}/invocations/{invocationId}:
    get:
      tags: [Invocation]
      operationId: getInvocationRecord
      summary: Get invocation record detail with sanitized parameters
      description: >-
        Returns full sanitized request parameters for the caller's own invocation.
        Encryption passwords are never returned. Cross-credential access is denied.
      parameters:
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/InvocationId'
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Invocation detail returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationDetailResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/{environment}/v1/admin/api-credentials:
    get:
      tags: [Admin]
      operationId: listApiCredentials
      summary: List API credentials for admin UI
      parameters:
        - $ref: '#/components/parameters/Environment'
        - name: operator
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Masked API credential list returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialListView'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Admin]
      operationId: createApiCredential
      summary: Create API credential
      parameters:
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreateRequest'
      responses:
        '200':
          description: API credential created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialCreationResult'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/{environment}/v1/admin/api-credentials/{credentialId}:
    get:
      tags: [Admin]
      operationId: getApiCredentialDetail
      summary: Get API credential detail for admin UI
      parameters:
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/CredentialId'
        - name: operator
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Masked API credential detail returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialDetailView'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/{environment}/v1/admin/api-credentials/{credentialId}/rotate:
    post:
      tags: [Admin]
      operationId: rotateApiCredential
      summary: Rotate API credential
      parameters:
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/CredentialId'
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRotateRequest'
      responses:
        '200':
          description: API credential rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRotationResult'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/{environment}/v1/admin/api-credentials/{credentialId}/revoke:
    post:
      tags: [Admin]
      operationId: revokeApiCredential
      summary: Revoke API credential
      parameters:
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/CredentialId'
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRevokeRequest'
      responses:
        '200':
          description: API credential revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRevocationResult'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/{environment}/v1/admin/api-credentials/{credentialId}/history:
    get:
      tags: [Admin]
      operationId: getApiCredentialHistory
      summary: Get API credential history for admin UI
      parameters:
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/CredentialId'
        - name: operator
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Masked credential lifecycle history returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CredentialHistoryEntry'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/{environment}/v1/admin/api-credentials/{credentialId}/summary:
    get:
      tags: [Admin]
      operationId: getApiCredentialSummary
      summary: Get API credential summary
      parameters:
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/CredentialId'
        - name: operator
          in: query
          required: true
          schema:
            type: string
            minLength: 1
