  /api/management/v1/templates:
    get:
      tags: [Admin]
      operationId: listTemplates
      summary: List templates (server-side PageView)
      description: >-
        Returns a standard management `PageView` of template package summaries
        for the caller's authorized groups (LR-C5 / BDD-LRP-C5-CATALOG-001).
        Pagination is **row-based** with default sort group-first
        (`groupCode ASC`, then `updatedAt DESC` — COR-F09 semantics retained;
        not group-count pages). Empty accessible groups yield an empty page
        (`totalElements: 0`) without leaking other groups. Optional filters AND
        together; changing filters/search/sort resets UI to `page=0`.
        Normalization: missing/`size` out of 1…100 → default 20 (or clamp
        `size>100` to 100 — implementation locks one); `page<0` → 0; page past
        last → empty `content` with unchanged `totalElements`. Requires catalog
        browse access per permission matrix. Traceability: BDD-LRP-C5-001…015.
      parameters:
        - $ref: '#/components/parameters/CatalogPageQuery'
        - $ref: '#/components/parameters/CatalogSizeQuery'
        - $ref: '#/components/parameters/CatalogSearchQuery'
        - $ref: '#/components/parameters/CatalogGroupCodeQuery'
        - name: lifecycleStatus
          in: query
          required: false
          description: >-
            Exact template lifecycle status filter (UI status / workflow chips).
            Workflow chip mapping: awaitingTest→TESTING; awaitingPublish→PENDING_RELEASE;
            awaitingApproval→APPROVAL (with `approvalSubState=PENDING_DECISION`
            for SINGLE_TRACK; IBL-E3 multi-stage uses PENDING_LEGAL_DECISION /
            PENDING_COMPLIANCE_DECISION).
            Unknown enum values: empty page recommended (or 400/422 — lock in tests).
          schema:
            $ref: '#/components/schemas/TemplateLifecycleStatus'
        - name: approvalSubState
          in: query
          required: false
          description: >-
            Optional approval sub-state filter (templates only). Used with
            `lifecycleStatus=APPROVAL` for awaiting-approval chips
            (`PENDING_DECISION`, or IBL-E3 `PENDING_LEGAL_DECISION` /
            `PENDING_COMPLIANCE_DECISION`).
          schema:
            type: string
            enum:
              - PENDING_SUBMIT
              - PENDING_DECISION
              - PENDING_LEGAL_DECISION
              - PENDING_COMPLIANCE_DECISION
        - name: sort
          in: query
          required: false
          description: >-
            Whitelist sort key. Default `groupCodeAsc` (group-first). Unknown
            values fall back to `groupCodeAsc` (no 400). Templates also support
            `externalIdAsc`.
          schema:
            type: string
            enum:
              - groupCodeAsc
              - updatedAtDesc
              - updatedAtAsc
              - nameAsc
              - externalIdAsc
            default: groupCodeAsc
        - name: locale
          in: query
          required: false
          description: >-
            IBL-E1 / ADR-0062 — optional exact match on template package body
            `locale` (BCP-47). AND with search / groupCode / lifecycleStatus /
            approvalSubState / sort. Unknown or non-matching values → successful
            empty page (not 400).
          schema:
            type: string
            maxLength: 64
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: Paginated template summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateSummaryPageResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Admin]
      operationId: createTemplate
      summary: Create a template package
      description: >-
        Creates a template package under an authorized group (management catalog).
        IBL-E1 / ADR-0062: `locale` (BCP-47) is required; optional
        `localeVariantFamilyId` groups translation siblings. Same group + family
        + locale conflict → `409 LOCALE_VARIANT_CONFLICT`.
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
      responses:
        '200':
          description: Template created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetailResponse'
        '201':
