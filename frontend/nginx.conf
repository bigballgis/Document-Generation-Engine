server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Lazy upstream resolution so NGINX starts before backend pods/containers are ready.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # LR-B3 (CD-PIT-12): SSE progress streams must not be buffered; heartbeat every 20s,
    # read timeout >= 3x heartbeat. Scoped to progress-stream paths only.
    location ~ ^/api/management/v1/.+/progress-stream$ {
        set $backend_upstream docgen-backend:8080;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Trace-Id $request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /api/ {
        set $backend_upstream docgen-backend:8080;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Trace-Id $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
