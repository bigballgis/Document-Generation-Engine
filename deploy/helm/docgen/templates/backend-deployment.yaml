{{- if and .Values.backend.enabled (not .Values.blueGreen.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docgen.backend.fullname" . }}
  labels:
    {{- include "docgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ include "docgen.backend.replicas" . }}
  selector:
    matchLabels:
      {{- include "docgen.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "docgen.backend.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "docgen.podSecurityContext" . | nindent 8 }}
        fsGroup: {{ .Values.backend.podSecurityContext.fsGroup }}
        fsGroupChangePolicy: {{ .Values.backend.podSecurityContext.fsGroupChangePolicy }}
      containers:
        - name: backend
          image: {{ include "docgen.backend.image" . | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "docgen.configMapName" . }}
            - secretRef:
                name: {{ include "docgen.secretName" . }}
          securityContext:
            {{- include "docgen.containerSecurityContext" . | nindent 12 }}
            runAsUser: {{ .Values.backend.securityContext.runAsUser }}
            runAsGroup: {{ .Values.backend.securityContext.runAsGroup }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.readiness.failureThreshold }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.backend.tmpfs.sizeLimit }}
{{- end }}
