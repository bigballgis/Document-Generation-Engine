{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docgen.secretName" . }}
  labels:
    {{- include "docgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  POSTGRES_USER: {{ required "secrets.data.POSTGRES_USER is required when secrets.create=true (supply via --set at install; never commit plaintext)" .Values.secrets.data.POSTGRES_USER | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.data.POSTGRES_PASSWORD is required when secrets.create=true (supply via --set at install; never commit plaintext)" .Values.secrets.data.POSTGRES_PASSWORD | quote }}
  MINIO_ROOT_USER: {{ required "secrets.data.MINIO_ROOT_USER is required when secrets.create=true (supply via --set at install; never commit plaintext)" .Values.secrets.data.MINIO_ROOT_USER | quote }}
  MINIO_ROOT_PASSWORD: {{ required "secrets.data.MINIO_ROOT_PASSWORD is required when secrets.create=true (supply via --set at install; never commit plaintext)" .Values.secrets.data.MINIO_ROOT_PASSWORD | quote }}
  JWT_SECRET: {{ required "secrets.data.JWT_SECRET is required when secrets.create=true (supply via --set at install; never commit plaintext)" .Values.secrets.data.JWT_SECRET | quote }}
{{- end }}
