{{- if and .Values.backend.enabled .Values.autoscaling.backend.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "docgen.backend.fullname" . }}
  labels:
    {{- include "docgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ if .Values.blueGreen.enabled }}{{ include "docgen.backend.color.fullname" (dict "root" . "color" .Values.blueGreen.activeColor) }}{{ else }}{{ include "docgen.backend.fullname" . }}{{ end }}
  minReplicas: {{ .Values.autoscaling.backend.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.backend.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.backend.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.backend.targetMemoryUtilizationPercentage }}
    {{- if .Values.autoscaling.backend.customMetric.enabled }}
    # Custom metric requires Prometheus Adapter (or equivalent) per ADR-0030.
    - type: Pods
      pods:
        metric:
          name: {{ .Values.autoscaling.backend.customMetric.name }}
        target:
          type: {{ .Values.autoscaling.backend.customMetric.targetType }}
          {{- if eq .Values.autoscaling.backend.customMetric.targetType "AverageValue" }}
          averageValue: {{ .Values.autoscaling.backend.customMetric.averageValue | quote }}
          {{- end }}
    {{- end }}
{{- end }}
