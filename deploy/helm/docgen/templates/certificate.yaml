{{- if .Values.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "docgen.fullname" . }}-tls
  labels:
    {{- include "docgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificate
spec:
  secretName: {{ include "docgen.tlsSecretName" . }}
  issuerRef:
    name: {{ required "certificate.issuerRef.name is required" .Values.certificate.issuerRef.name }}
    kind: {{ .Values.certificate.issuerRef.kind }}
  dnsNames:
    {{- if .Values.certificate.dnsNames }}
    {{- toYaml .Values.certificate.dnsNames | nindent 4 }}
    {{- else }}
    - {{ .Values.ingress.host | quote }}
    {{- end }}
  # ADR-0030: private key + cert must support TLS 1.2+ cipher suites at the Ingress controller.
  privateKey:
    algorithm: RSA
    size: 2048
{{- end }}
