{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "docgen.frontend.fullname" . }}
  labels:
    {{- include "docgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    docgen.io/cluster-dns: {{ include "docgen.frontend.serviceFqdn" . | quote }}
    docgen.io/service-port: {{ .Values.frontend.service.port | quote }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "docgen.frontend.selectorLabels" . | nindent 4 }}
    {{- if .Values.blueGreen.enabled }}
    docgen.io/deployment-color: {{ .Values.blueGreen.activeColor | quote }}
    {{- end }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
