{{- if .Values.networkPolicy.enabled }}
---
# Default-deny: all pods in the release namespace (ADR-0030 / P15-T06).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "docgen.fullname" . }}-default-deny
  labels:
    {{- include "docgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow ingress from NGINX Ingress Controller to frontend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "docgen.fullname" . }}-allow-ingress-controller
  labels:
    {{- include "docgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      {{- include "docgen.frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressController.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.port }}
---
{{- if .Values.ingress.enabled }}
# Allow ingress from NGINX Ingress Controller to backend (direct /api path — P15-T04b).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "docgen.fullname" . }}-allow-ingress-to-backend
  labels:
    {{- include "docgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      {{- include "docgen.backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressController.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
---
{{- end }}
# Allow frontend → backend (in-cluster API proxy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "docgen.fullname" . }}-allow-frontend-to-backend
  labels:
    {{- include "docgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      {{- include "docgen.backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "docgen.frontend.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
---
# Allow backend egress to external managed data services (Postgres/Redis/Kafka/MinIO).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "docgen.fullname" . }}-allow-backend-external-egress
  labels:
    {{- include "docgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      {{- include "docgen.backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- range .Values.networkPolicy.externalEgress.cidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        {{- toYaml $.Values.networkPolicy.externalEgress.ports | nindent 8 }}
    {{- end }}
---
# Allow DNS resolution (kube-system).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "docgen.fullname" . }}-allow-dns
  labels:
    {{- include "docgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dns.namespace }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- if .Values.networkPolicy.monitoring.enabled }}
---
# Allow Prometheus metrics scrape from monitoring namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "docgen.fullname" . }}-allow-metrics
  labels:
    {{- include "docgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      {{- include "docgen.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoring.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.monitoring.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
        - protocol: TCP
          port: {{ .Values.frontend.port }}
{{- end }}
{{- end }}
