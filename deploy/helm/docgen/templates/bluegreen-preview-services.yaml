{{- if and .Values.blueGreen.enabled .Values.blueGreen.previewService.enabled }}
{{- $inactive := include "docgen.blueGreen.inactiveColor" . }}
{{- if .Values.backend.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "docgen.backend.fullname" . }}-preview
  labels:
    {{- include "docgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    docgen.io/traffic-role: preview
spec:
  type: ClusterIP
  selector:
    {{- include "docgen.backend.selectorLabels" . | nindent 4 }}
    docgen.io/deployment-color: {{ $inactive | quote }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- if .Values.frontend.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "docgen.frontend.fullname" . }}-preview
  labels:
    {{- include "docgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
    docgen.io/traffic-role: preview
spec:
  type: ClusterIP
  selector:
    {{- include "docgen.frontend.selectorLabels" . | nindent 4 }}
    docgen.io/deployment-color: {{ $inactive | quote }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
