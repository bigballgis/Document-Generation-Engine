# LR-D3 Prometheus alert rules — DRAFT thresholds only (NOT confirmed SLOs).
# Validate: promtool check rules deploy/observability/prometheus-alerts.yaml
# Every rule carries annotations.runbook → docs/operations/runbook.md#<anchor>
groups:
  - name: docgen-lrp-d3
    rules:
      - alert: DocgenBackendDown
        expr: up{job="docgen-backend"} == 0
        for: 2m
        labels:
          severity: critical
          draft: "true"
        annotations:
          summary: "Docgen backend scrape target down ≥ 2m (draft)"
          description: "Prometheus job docgen-backend is down. Confirm /healthz and recent deploy."
          runbook: "docs/operations/runbook.md#alert-backend-down"
          draft: "true"
          nfr_reference: "LR-D5 pending proposal — not SLA until confirmed"

      - alert: DocgenGenerationLatencyP95Draft
        # Interim envelope from LR-D6 FOL concurrent smoke success-sample p95≈15939ms / p99≈16065ms.
        # Prefer ~16s over stale F8 ≤3s/≤10s aspirational drafts (unsupported by D6).
        expr: histogram_quantile(0.95, sum(rate(docgen_generation_duration_seconds_bucket{mode="sync"}[5m])) by (le)) > 16
        for: 5m
        labels:
          severity: warning
          draft: "true"
        annotations:
          summary: "Sync generation p95 > 16s interim D6 envelope (draft)"
          description: "Draft alert aligned to LR-D6 measured envelope (~16s). NOT a confirmed SLO. See DEF-LRP-D6-001 for concurrent PDF triage."
          runbook: "docs/operations/runbook.md#alert-p95-latency-breach-draft"
          draft: "true"
          nfr_reference: "LR-D5 pending proposal — interim D6 envelope ~16s; stale-vs-D6 if replaced with ≤3s/≤10s"
          d6_baseline: "p95≈15939ms p99≈16065ms Scenario A success samples"

      - alert: DocgenPdfPoolRejections
        expr: increase(docgen_pdf_conversion_pool_rejections_total[2m]) > 0
        for: 2m
        labels:
          severity: warning
          draft: "true"
        annotations:
          summary: "PDF conversion pool rejections > 0 for ≥ 2m (draft)"
          description: "Bounded PDF pool rejected work. D6 Scenario A baseline poolRejections=0 — non-zero is a new capacity signal."
          runbook: "docs/operations/runbook.md#alert-pdf-pool-rejections"
          draft: "true"
          nfr_reference: "LR-D5 pending proposal — not SLA until confirmed"

      - alert: DocgenAsyncDltDepth
        expr: docgen_async_dlt_depth > 0
        for: 5m
        labels:
          severity: warning
          draft: "true"
        annotations:
          summary: "Async Kafka DLT depth > 0 for ≥ 5m (draft)"
          description: "Dead-letter topic has messages while ASYNC_TRANSPORT=kafka. Pre-measurement ops signal (no D6 baseline)."
          runbook: "docs/operations/runbook.md#alert-dlt-depth"
          draft: "true"
          nfr_reference: "LR-D5 pending proposal — not SLA until confirmed"

      - alert: DocgenHttp429Surge
        expr: rate(docgen_http_rate_limit_denied_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          draft: "true"
        annotations:
          summary: "HTTP 429 rate-limit denials > 1/s for ≥ 5m (draft placeholder)"
          description: "Runtime rate limiter surge. No D6 429 rate baseline — calibrate after scrape."
          runbook: "docs/operations/runbook.md#alert-429-surge"
          draft: "true"
          nfr_reference: "LR-D5 pending proposal — not SLA until confirmed"

  - name: docgen-backend-supplemental
    rules:
      - alert: HighPdfConversionFailureRate
        expr: rate(docgen_pdf_conversion_outcome_total{result="failure"}[5m]) > 0.17
        for: 5m
        labels:
          severity: critical
          draft: "true"
        annotations:
          summary: "PDF conversion failure rate elevated (draft)"
          description: "LibreOffice conversion failures; check LR-A1 profile isolation and font baseline."
          runbook: "docs/operations/runbook.md#alert-pdf-pool-rejections"
          draft: "true"
          nfr_reference: "LR-D5 pending proposal — not SLA until confirmed"

      - alert: HighSseEmitterCount
        expr: docgen_sse_emitters_active > 100
        for: 5m
        labels:
          severity: warning
          draft: "true"
        annotations:
          summary: "Active SSE emitters > 100 (draft capacity / leak signal)"
          description: "Check for leaked SSE connections (LR-B3)."
          runbook: "docs/operations/runbook.md#alert-sse-emitters"
          draft: "true"
          nfr_reference: "LR-D5 pending proposal — SSE concurrency not confirmed"
