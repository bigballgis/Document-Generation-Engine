# SOR-C05 — dependency audit, container scan, SBOM artifact
name: Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches:
      - main
      - 'cursor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  dependency-audit:
    name: npm audit + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend audit
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high || true
          mkdir -p ../artifacts/sbom
          pnpm sbom
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: artifacts/sbom/
          retention-days: 30

  trivy-image-scan:
    name: Trivy scan runtime images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy on backend Dockerfile
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: backend/Dockerfile.packaged
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Run Trivy on frontend Dockerfile
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: frontend/Dockerfile.packaged
          severity: CRITICAL,HIGH
          exit-code: '0'
