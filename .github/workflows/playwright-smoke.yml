# SOR-C03 / FOS-W12-3 — Playwright smoke tier in CI
# Honesty: does NOT start a second compose stack. Requires pre-provisioned :8080/:4173
# or fails (probe + globalSetup). Vacuous skip-all cannot be green.
name: Playwright Smoke

on:
  push:
    branches:
      - main
      - 'cursor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: playwright-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: E2E smoke tier
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      E2E_REQUIRE_STACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Probe acceptance stack (honest fail if missing)
        run: |
          set +e
          curl -fsS --max-time 5 http://127.0.0.1:8080/healthz >/dev/null
          BE=$?
          curl -fsS --max-time 5 http://127.0.0.1:4173/ >/dev/null
          FE=$?
          if [ "$BE" -ne 0 ] || [ "$FE" -ne 0 ]; then
            echo "::error::FOS-W12-3 stack not provisioned on this runner (backend=$BE frontend=$FE)."
            echo "GitHub-hosted runners do not share the lab Docker host. Smoke is BLOCKED here unless a self-hosted runner with the acceptance stack is used."
            echo "Do not treat skip-all as green."
            exit 1
          fi
      - name: Run smoke specs
        working-directory: frontend
        run: pnpm test:e2e:docker
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
