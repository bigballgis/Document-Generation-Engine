# SOR-C01 — blocking constitution quality gates (TDD/BDD constitution)
name: Constitution Gates

on:
  push:
    branches:
      - main
      - 'cursor/**'
  pull_request:
    branches:
      - main

concurrency:
  group: constitution-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verify:
    name: Backend mvn verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn verify
        run: mvn -B -ntp -f backend/pom.xml verify

  frontend-gates:
    name: Frontend lint / type-check / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install and run gates
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm type-check
          pnpm test
          pnpm build
