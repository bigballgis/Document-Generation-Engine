# SOR-C02 — changed-line coverage ratchet (constitution target 85%/90%)
name: Coverage Ratchet

on:
  pull_request:
    branches:
      - main
      - 'cursor/**'

jobs:
  coverage-ratchet:
    name: JaCoCo + Vitest floor check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Backend bundle floors (0.70 line / 0.45 branch)
        run: mvn -B -ntp -f backend/pom.xml verify
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend Vitest floors
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - name: Ratchet plan reminder
        run: |
          echo "Constitution target: changed lines >=85%, security-critical >=90%."
          echo "Current bundle floors: backend LINE 0.70 / BRANCH 0.45; frontend lines 22 / fn 32 / branch 55."
          echo "Per-package ratchet tracked in docs/plan/coverage-ratchet-plan.md"
